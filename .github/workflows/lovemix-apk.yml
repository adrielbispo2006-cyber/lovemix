
name: Compilar APK LoveMix + SHA1 SHA256

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Não usar setup-android: o runner já possui SDK.
      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="$SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Preparar projeto Flutter
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            echo "FLUTTER_PROJECT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 2 -name "*.zip" -type f | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: ZIP não encontrado"
              exit 1
            fi

            mkdir -p extraido
            unzip -q "$ZIP" -d extraido

            PUBSPEC=$(find extraido -name pubspec.yaml -type f | head -n 1)

            if [ -z "$PUBSPEC" ]; then
              echo "ERRO: pubspec.yaml não encontrado"
              exit 1
            fi

            echo "FLUTTER_PROJECT=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"
          fi

      - name: Baixar dependências
        run: |
          cd "$FLUTTER_PROJECT"
          flutter pub get

      - name: Verificar Flutter
        run: |
          cd "$FLUTTER_PROJECT"
          flutter doctor -v

      - name: Compilar APK Release
        run: |
          cd "$FLUTTER_PROJECT"
          flutter build apk --release

      - name: Gerar SHA1 e SHA256
        shell: bash
        run: |
          set -e

          APK="$FLUTTER_PROJECT/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK não encontrado"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "Apksigner não encontrado"
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" \
            | tee "$GITHUB_WORKSPACE/fingerprints.txt"

          cp "$APK" "$GITHUB_WORKSPACE/LoveMix.apk"

          {
            echo "## Certificados LoveMix"
            echo '```text'
            cat "$GITHUB_WORKSPACE/fingerprints.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar APK e SHA
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK-SHA1-SHA256
          path: |
            LoveMix.apk
            fingerprints.txt
          retention-days: 30
