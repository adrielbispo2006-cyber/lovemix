
name: Compilar LoveMix APK + SHA1 SHA256

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configurar Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Instalar SDK e Build Tools
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Preparar projeto Flutter
        shell: bash
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "Projeto Flutter encontrado na raiz."
          else
            ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "ERRO: Nenhum projeto Flutter ou ZIP encontrado."
              exit 1
            fi

            mkdir -p extraido
            unzip -q "$ZIP" -d extraido

            PUBSPEC=$(find extraido -name pubspec.yaml -type f | head -n 1)
            if [ -z "$PUBSPEC" ]; then
              echo "ERRO: pubspec.yaml não encontrado."
              exit 1
            fi

            cd "$(dirname "$PUBSPEC")"
            echo "FLUTTER_PROJECT=$PWD" >> "$GITHUB_ENV"
          fi

          if [ -z "${FLUTTER_PROJECT:-}" ]; then
            echo "FLUTTER_PROJECT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Baixar dependências
        run: |
          cd "$FLUTTER_PROJECT"
          flutter pub get

      - name: Verificar Flutter
        run: |
          cd "$FLUTTER_PROJECT"
          flutter doctor -v

      - name: Compilar APK Release
        run: |
          cd "$FLUTTER_PROJECT"
          flutter build apk --release

      - name: Gerar SHA1 e SHA256
        shell: bash
        run: |
          APK=$(find "$FLUTTER_PROJECT/build/app/outputs" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK não encontrado."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "Apksigner não encontrado."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" \
            | tee "$GITHUB_WORKSPACE/fingerprints.txt"

          cp "$APK" "$GITHUB_WORKSPACE/LoveMix.apk"

          {
            echo "## LoveMix - Certificados"
            echo '```text'
            cat "$GITHUB_WORKSPACE/fingerprints.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar APK e fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK-SHA1-SHA256
          path: |
            LoveMix.apk
            fingerprints.txt
          retention-days: 30
