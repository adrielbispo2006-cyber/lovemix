
name: Compilar APK LoveMix + SHA1 SHA256

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Baixar projeto
      - name: Baixar projeto
        uses: actions/checkout@v4

      # Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Flutter
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android SDK 36
      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERRO: Android SDK não encontrado"
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado"
            exit 1
          fi

          # Aceitar licenças sem falha Broken pipe
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          # Instalar SDK e ferramentas
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "SDK 36 instalado!"

      # Preparar projeto
      - name: Preparar projeto Flutter
        shell: bash
        run: |
          set -e

          if [ -f "pubspec.yaml" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            ZIP=$(find . -maxdepth 2 \
              -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: ZIP do projeto não encontrado"
              exit 1
            fi

            mkdir -p extraido
            unzip -q "$ZIP" -d extraido

            PUBSPEC=$(find extraido \
              -type f -name pubspec.yaml | head -n 1)

            if [ -z "$PUBSPEC" ]; then
              echo "ERRO: pubspec.yaml não encontrado"
              exit 1
            fi

            PROJECT=$(dirname "$PUBSPEC")
          fi

          echo "FLUTTER_PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Projeto localizado: $PROJECT"

      # Dependências
      - name: Baixar dependências
        run: |
          cd "$FLUTTER_PROJECT"
          flutter pub get

      # Verificação
      - name: Verificar Flutter
        run: |
          cd "$FLUTTER_PROJECT"
          flutter doctor -v

      # Compilar
      - name: Compilar APK Release
        run: |
          cd "$FLUTTER_PROJECT"
          flutter build apk --release

      # Gerar certificados
      - name: Gerar SHA1 e SHA256
        shell: bash
        run: |
          set -e

          APK="$FLUTTER_PROJECT/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERRO: apksigner não encontrado"
            exit 1
          fi

          # Verificar assinatura e imprimir fingerprints
          "$APKSIGNER" verify --print-certs "$APK" \
            | tee "$GITHUB_WORKSPACE/fingerprints.txt"

          # Copiar APK
          cp "$APK" "$GITHUB_WORKSPACE/LoveMix.apk"

          # Resumo do GitHub
          {
            echo "## LoveMix - Certificados"
            echo '```text'
            cat "$GITHUB_WORKSPACE/fingerprints.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Salvar arquivos
      - name: Salvar APK e SHA1 SHA256
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK-SHA1-SHA256
          path: |
            LoveMix.apk
            fingerprints.txt
          retention-days: 30
