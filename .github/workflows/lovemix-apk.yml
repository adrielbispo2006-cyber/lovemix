
name: LoveMix - Compilar APK e gerar SHA1 SHA256

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SEARCH="$ROOT"

          if ! find "$SEARCH" -name pubspec.yaml \
            -not -path '*/build/*' \
            -not -path '*/.dart_tool/*' | grep -q .; then

            ZIP_FILE=$(find "$ROOT" -maxdepth 4 \
              -type f -iname '*.zip' | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Nenhum pubspec.yaml ou ZIP encontrado."
              exit 1
            fi

            mkdir -p "$ROOT/extracted"
            unzip -q -o "$ZIP_FILE" -d "$ROOT/extracted"
            SEARCH="$ROOT/extracted"
          fi

          PUBSPEC=$(find "$SEARCH" -name pubspec.yaml \
            -not -path '*/build/*' \
            -not -path '*/.dart_tool/*' | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          test -f "$PROJECT_DIR/lib/main.dart"
          test -d "$PROJECT_DIR/android"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Instalar dependências
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Gerar SHA1 e SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-debug.apk"

          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          "$APKSIGNER" verify --print-certs "$APK" \
            | tee "$GITHUB_WORKSPACE/fingerprints.txt"

          {
            echo "## SHA1 e SHA256 do APK"
            cat "$GITHUB_WORKSPACE/fingerprints.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar APK e assinaturas
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK-SHA
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
            fingerprints.txt
