
name: LoveMix - Compilar APK e gerar SHA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Localizar projeto Flutter
        run: |
          PROJECT_DIR=$(find . -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: pubspec.yaml não encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Gerar SHA1 e SHA256
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          "$APKSIGNER" verify --print-certs "$APK" \
            | tee "$GITHUB_WORKSPACE/fingerprints.txt"

          {
            echo "## SHA-1 e SHA-256"
            cat "$GITHUB_WORKSPACE/fingerprints.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar APK e assinaturas
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK-SHA
          path: |
            **/build/app/outputs/flutter-apk/app-debug.apk
            fingerprints.txt
