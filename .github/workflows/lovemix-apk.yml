
name: LoveMix - Compilar APK e gerar SHA1 SHA256

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --debug

      - name: Gerar SHA1 e SHA256
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          echo "## ASSINATURAS DO APK" >> $GITHUB_STEP_SUMMARY
          echo '### SHA-1' >> $GITHUB_STEP_SUMMARY
          keytool -printcert -jarfile "$APK" | grep -E 'SHA1:|SHA256:' | tee fingerprints.txt
          cat fingerprints.txt >> $GITHUB_STEP_SUMMARY

      - name: Salvar APK e assinaturas
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK-SHA
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            fingerprints.txt
