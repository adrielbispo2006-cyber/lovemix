
name: Gerar APK LoveMix

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Baixar projeto
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter
      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Ferramentas
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip curl jq file python3

      # 5. Localizar projeto
      - name: Localizar projeto LoveMix
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          if [[ -f "$GITHUB_WORKSPACE/pubspec.yaml" && -f "$GITHUB_WORKSPACE/lib/main.dart" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo '::error::Nenhum ZIP encontrado.'
              exit 1
            fi

            echo "Extraindo: $ZIP_FILE"

            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

            PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' | head -n 1)"

            if [[ -z "$PUBSPEC" ]]; then
              echo '::error::pubspec.yaml não encontrado.'
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"

          test -f "$PROJECT_DIR/android/app/build.gradle" || \
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"

          test -f "$PROJECT_DIR/android/settings.gradle" || \
          test -f "$PROJECT_DIR/android/settings.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado: $PROJECT_DIR"

      # 6. Instalar Gradle oficial e substituir Wrapper antigo
      - name: Instalar Gradle oficial 9.3.1
        shell: bash
        run: |
          set -euo pipefail

          echo "Baixando Gradle 9.3.1 oficial..."

          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            --output /tmp/gradle-9.3.1.zip

          unzip -q -o /tmp/gradle-9.3.1.zip -d /tmp

          GRADLE_BIN="/tmp/gradle-9.3.1/bin/gradle"

          test -x "$GRADLE_BIN"

          echo "Validando instalação..."

          "$GRADLE_BIN" --version

          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"

          # Atualizar propriedades do projeto
          cat > "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties" <<'PROPERTIES'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=120000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPERTIES

          # Substituir o gradlew antigo por um lançador direto
          cat > "$PROJECT_DIR/android/gradlew" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec /tmp/gradle-9.3.1/bin/gradle "$@"
          SCRIPT

          chmod 755 "$PROJECT_DIR/android/gradlew"

          echo "Gradle 9.3.1 instalado e Wrapper antigo substituído."

      # 7. Validar configurações Android
      - name: Validar configurações Android
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"

          SETTINGS="$ANDROID_DIR/settings.gradle"

          if [[ ! -f "$SETTINGS" ]]; then
            SETTINGS="$ANDROID_DIR/settings.gradle.kts"
          fi

          grep -q 'com.android.application' "$SETTINGS" || {
            echo '::error::Plugin Android não encontrado.'
            exit 1
          }

          grep -q 'org.jetbrains.kotlin.android' "$SETTINGS" || {
            echo '::error::Plugin Kotlin não encontrado.'
            exit 1
          }

          grep -Fq 'gradle-9.3.1-bin.zip' \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"

          test -x "$ANDROID_DIR/gradlew"

          echo "Configuração Android validada."

      # 8. Cache Gradle
      - name: Preparar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: lovemix-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.yaml') }}
          restore-keys: |
            lovemix-gradle-${{ runner.os }}-

      # 9. Assinatura persistente opcional
      - name: Configurar assinatura persistente (opcional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo 'Keystore não configurado; será usada a assinatura do projeto.'
            exit 0
          fi

          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Configure todos os secrets ANDROID_*.'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/lovemix-signing"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/lovemix-signing/release.jks"

          test -s "$RUNNER_TEMP/lovemix-signing/release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lovemix-signing/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      # 10. Dependências Flutter
      - name: Baixar dependências Flutter
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter pub get

      # 11. Corrigir plugins ZEGO
      - name: Corrigir repositórios e ordem dos plugins ZEGO
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          cache = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          package_dirs = sorted(cache.glob('zego_*/android'))

          if not package_dirs:
              print('::error::Nenhum pacote Android ZEGO encontrado.')
              sys.exit(1)

          changed = []

          for android_dir in package_dirs:
              files = (
                  list(android_dir.glob('*.gradle')) +
                  list(android_dir.glob('*.gradle.kts'))
              )

              for gradle_file in files:
                  original = gradle_file.read_text()

                  content = re.sub(
                      r'\bjcenter\s*\(\s*\)',
                      'mavenCentral()',
                      original
                  )

                  lines = content.splitlines()

                  android_pattern = re.compile(
                      r'''^\s*apply\s+plugin\s*:\s*['"]com\.android\.(?:library|application)['"]'''
                  )

                  kotlin_pattern = re.compile(
                      r'''^\s*apply\s+plugin\s*:\s*['"](?:kotlin-android|org\.jetbrains\.kotlin\.android)['"]'''
                  )

                  android_positions = [
                      i for i, line in enumerate(lines)
                      if android_pattern.search(line)
                  ]

                  kotlin_positions = [
                      i for i, line in enumerate(lines)
                      if kotlin_pattern.search(line)
                  ]

                  if android_positions and kotlin_positions:
                      if min(android_positions) > min(kotlin_positions):

                          android_line = lines[min(android_positions)]
                          kotlin_line = lines[min(kotlin_positions)]

                          remove = set(android_positions + kotlin_positions)
                          first = min(remove)

                          lines = [
                              line for i, line in enumerate(lines)
                              if i not in remove
                          ]

                          lines[first:first] = [
                              android_line,
                              kotlin_line
                          ]

                          content = '\n'.join(lines) + '\n'

                  if content != original:
                      gradle_file.write_text(content)
                      changed.append(str(gradle_file))

          print('Arquivos ZEGO corrigidos:')

          for item in changed:
              print(item)

          print('Correção ZEGO concluída.')
          PY

      # 12. Validar ambiente e Gradle
      - name: Validar ambiente Gradle 9.3.1
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo "Flutter:"
          flutter --version

          echo "Gradle utilizado pelo projeto:"

          cd android

          ./gradlew --stop || true

          ./gradlew --version | tee /tmp/lovemix-gradle-version.txt

          grep -q 'Gradle 9.3.1' /tmp/lovemix-gradle-version.txt

          echo "Gradle 9.3.1 confirmado!"

      # 13. Compilar APK Release
      - name: Compilar APK Release
        id: build_apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Verificando Gradle antes da compilação..."

          cd android

          ./gradlew --version | tee /tmp/lovemix-final-gradle.txt

          grep -q 'Gradle 9.3.1' /tmp/lovemix-final-gradle.txt

          cd ..

          echo "Iniciando compilação Flutter..."

          flutter build apk --release

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            APK="$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
              -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          fi

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo '::error::APK Release não foi gerado.'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$APK" "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          test -s "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          echo "APK LoveMix gerado com sucesso!"

      # 14. Validar APK
      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          test -s "$APK"

          file "$APK"

          echo "APK validado."

      # 15. Calcular SHA-1 e SHA-256
      - name: Calcular SHA-1 SHA-256 e fingerprints
        id: hashes
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          FILE_SHA1="$(sha1sum "$APK" | awk '{print $1}')"
          FILE_SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=""

          if [[ -n "$SDK_DIR" && -d "$SDK_DIR/build-tools" ]]; then
            APKSIGNER="$(find "$SDK_DIR/build-tools" \
              -type f -name apksigner | sort -V | tail -n 1 || true)"
          fi

          CERT_SHA1='Não disponível'
          CERT_SHA256='Não disponível'

          if [[ -n "$APKSIGNER" ]]; then

            CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"

            CERT_SHA1="$(printf '%s\n' "$CERT_INFO" |
              sed -n 's/.*certificate SHA-1 digest: *//p' | head -n 1)"

            CERT_SHA256="$(printf '%s\n' "$CERT_INFO" |
              sed -n 's/.*certificate SHA-256 digest: *//p' | head -n 1)"

            CERT_SHA1="${CERT_SHA1:-Não disponível}"
            CERT_SHA256="${CERT_SHA256:-Não disponível}"

          else
            echo '::warning::apksigner não encontrado.'
          fi

          {
            echo "file_sha1=$FILE_SHA1"
            echo "file_sha256=$FILE_SHA256"
            echo "cert_sha1=$CERT_SHA1"
            echo "cert_sha256=$CERT_SHA256"
          } >> "$GITHUB_OUTPUT"

          {
            echo 'LoveMix - Verificação de integridade'
            echo
            echo 'APK: LoveMix-release.apk'
            echo
            echo 'SHA-1 do arquivo:'
            echo "$FILE_SHA1"
            echo
            echo 'SHA-256 do arquivo:'
            echo "$FILE_SHA256"
            echo
            echo 'SHA-1 do certificado Firebase/Google:'
            echo "$CERT_SHA1"
            echo
            echo 'SHA-256 do certificado Firebase/Google:'
            echo "$CERT_SHA256"
          } > "$GITHUB_WORKSPACE/dist/CHECKSUMS.txt"

          echo "Hashes calculados."

      # 16. Publicar artefato
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: |
            dist/LoveMix-release.apk
            dist/CHECKSUMS.txt
          if-no-files-found: error
          retention-days: 30

      # 17. Preparar Release
      - name: Preparar Release
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="lovemix-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=LoveMix ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # 18. Criar Release
      - name: Criar Release para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            # 💜 LoveMix

            APK Release compilado automaticamente.

            SHA-1 e SHA-256 do arquivo e do certificado estão em CHECKSUMS.txt.
          files: |
            dist/LoveMix-release.apk
            dist/CHECKSUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      # 19. Summary roxo e preto
      - name: Mostrar download e SHA no Summary
        if: success()
        env:
          FILE_SHA1: ${{ steps.hashes.outputs.file_sha1 }}
          FILE_SHA256: ${{ steps.hashes.outputs.file_sha256 }}
          CERT_SHA1: ${{ steps.hashes.outputs.cert_sha1 }}
          CERT_SHA256: ${{ steps.hashes.outputs.cert_sha256 }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          {
            echo '<table>'
            echo '<tr><td bgcolor="#160b2e">'
            echo '<h1>💜 LoveMix</h1>'
            echo '<p><b>BUILD CONCLUÍDO COM SUCESSO</b></p>'
            echo '</td></tr>'
            echo '<tr><td bgcolor="#0d1117">'

            echo '<h2>📥 Download do aplicativo</h2>'
            echo "<a href=\"$RELEASE_URL\">💜 BAIXAR APK LOVEMIX</a>"

            echo '<h2>🔐 SHA-1 e SHA-256 do arquivo</h2>'

            echo '<b>SHA-1:</b>'
            echo '```text'
            echo "$FILE_SHA1"
            echo '```'

            echo '<b>SHA-256:</b>'
            echo '```text'
            echo "$FILE_SHA256"
            echo '```'

            echo '<h2>📱 Certificado Firebase/Google</h2>'

            echo '<b>Certificado SHA-1:</b>'
            echo '```text'
            echo "$CERT_SHA1"
            echo '```'

            echo '<b>Certificado SHA-256:</b>'
            echo '```text'
            echo "$CERT_SHA256"
            echo '```'

            echo '<h2>📦 Arquivos publicados</h2>'
            echo 'LoveMix-release.apk'
            echo
            echo 'CHECKSUMS.txt'

            echo '</td></tr>'
            echo '</table>'
          } >> "$GITHUB_STEP_SUMMARY"
