name: Gerar APK LoveMix

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' | sort)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Deixe somente um ZIP na raiz (encontrados: ${#ZIPS[@]})."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi
          unzip -t "${ZIPS[0]}"
          mkdir -p extracted
          unzip -q "${ZIPS[0]}" -d extracted

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"
            if [ -s "$DIR/lib/main.dart" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name pubspec.yaml -print0)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Flutter não encontrado."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar arquivos obrigatórios
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          for FILE in pubspec.yaml lib/main.dart android/gradlew android/gradle/wrapper/gradle-wrapper.properties android/app/src/main/AndroidManifest.xml; do
            test -s "$FILE" || { echo "::error::Arquivo ausente: $FILE"; exit 1; }
          done
          chmod +x android/gradlew

      - name: Mostrar versão do Gradle do projeto
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          grep -E '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties
          grep -E 'com.android.application' android/settings.gradle* || true

      - name: Permitir compileSdk 37 com o AGP do projeto
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          grep -q 'suppressUnsupportedCompileSdk' android/gradle.properties || \
          printf '\nandroid.suppressUnsupportedCompileSdk=37\n' >> android/gradle.properties

      - name: Configurar assinatura fixa do APK (se houver secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] \vert{}\vert{} [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] \vert{}\vert{} [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::warning::Secrets ANDROID_* não configurados: o APK usará chave debug (o SHA muda a cada build e o login Google pode falhar)."
            exit 0
          fi
          mkdir -p "$PROJECT_DIR/android/keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \vert{} base64 --decode > "$PROJECT_DIR/android/keystore/lovemix-release.jks"
          test -s "$PROJECT_DIR/android/keystore/lovemix-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/$PROJECT_DIR/android/keystore/lovemix-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verificar ambiente
        run: |
          flutter --version
          java -version

      - name: Baixar dependências Flutter
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analisar código Flutter
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK Release
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Localizar e validar APK
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

      - name: Mostrar SHA-1 e SHA-256 do certificado (para o Firebase)
        shell: bash
        run: |
          APKSIGNER="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)"
          CERTS="$("$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/apk-final/LoveMix.apk")"
          fmt() { echo "$1" \vert{} tr 'a-f' 'A-F' \vert{} sed 's/../&:/g; s/:$//'; }
          SHA1="$(fmt "$(echo "$CERTS" | grep -m1 'certificate SHA-1 digest' | awk '{print $NF}')")"
          SHA256="$(fmt "$(echo "$CERTS" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')")"
          {
            echo "SHA-1 DO
