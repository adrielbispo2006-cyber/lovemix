
name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip curl python3

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -iname '*.zip' | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Deixe somente um ZIP na raiz do repositório."
            exit 1
          fi

          unzip -t "${ZIPS[0]}"

          mkdir -p extracted
          unzip -q "${ZIPS[0]}" -d extracted

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -s "$DIR/lib/main.dart" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find extracted -type f -name pubspec.yaml -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Flutter não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -s pubspec.yaml
          test -s lib/main.dart
          test -s android/app/src/main/AndroidManifest.xml

          if [ ! -s android/settings.gradle ] && \
             [ ! -s android/settings.gradle.kts ]; then
            echo "::error::Arquivo settings.gradle ausente."
            exit 1
          fi

          if [ ! -s android/app/build.gradle ] && \
             [ ! -s android/app/build.gradle.kts ]; then
            echo "::error::Arquivo build.gradle do Android ausente."
            exit 1
          fi

          echo "Arquivos principais encontrados."

      - name: Atualizar Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1]) / "android"

          files = [
              root / "settings.gradle",
              root / "settings.gradle.kts",
              root / "build.gradle",
              root / "build.gradle.kts",
          ]

          patterns = [
              (
                  r'((?:id\s*\(?\s*["\']com\.android\.(?:application|library)["\']\s*\)?\s*version\s*["\']))[^"\']+(["\'])',
                  r'\g<1>9.1.1\g<2>'
              ),
              (
                  r'(com\.android\.tools\.build:gradle:)[0-9][^\'"]*',
                  r'\g<1>9.1.1'
              )
          ]

          for file in files:
              if not file.is_file():
                  continue

              content = file.read_text()

              for pattern, replacement in patterns:
                  content = re.sub(pattern, replacement, content)

              file.write_text(content)

          print("Verificação do Android Gradle Plugin concluída.")
          PY

      - name: Baixar Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail

          VERSION="9.3.1"
          DIR="$RUNNER_TEMP/lovemix-gradle"

          mkdir -p "$DIR"

          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o "$DIR/gradle.zip"

          unzip -q "$DIR/gradle.zip" -d "$DIR"

          GRADLE="$DIR/gradle-${VERSION}/bin/gradle"

          test -x "$GRADLE"

          "$GRADLE" --version

          echo "GRADLE_BOOTSTRAP=$GRADLE" >> "$GITHUB_ENV"

      - name: Gerar Gradle Wrapper automaticamente
        shell: bash
        run: |
          set -euo pipefail

          BOOTSTRAP="$RUNNER_TEMP/lovemix-wrapper"
          TARGET="$PROJECT_DIR/android"

          mkdir -p "$BOOTSTRAP"
          mkdir -p "$TARGET/gradle/wrapper"

          printf "rootProject.name = 'lovemix-wrapper'\n" \
            > "$BOOTSTRAP/settings.gradle"

          printf "\n" > "$BOOTSTRAP/build.gradle"

          cd "$BOOTSTRAP"

          "$GRADLE_BOOTSTRAP" \
            --no-daemon \
            wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar

          cp gradlew "$TARGET/gradlew"
          cp gradlew.bat "$TARGET/gradlew.bat"

          cp gradle/wrapper/gradle-wrapper.jar \
            "$TARGET/gradle/wrapper/gradle-wrapper.jar"

          cat > "$TARGET/gradle/wrapper/gradle-wrapper.properties" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          chmod +x "$TARGET/gradlew"

          echo "Gradle Wrapper criado."

      - name: Confirmar configuração do Wrapper
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$PROJECT_DIR/android"

          test -s "$TARGET/gradlew"
          test -s "$TARGET/gradle/wrapper/gradle-wrapper.jar"
          test -s "$TARGET/gradle/wrapper/gradle-wrapper.properties"

          grep -Fq 'gradle-9.3.1-bin.zip' \
            "$TARGET/gradle/wrapper/gradle-wrapper.properties"

          echo "Wrapper validado."

      - name: Preparar cache Gradle
        shell: bash
        run: |
          set -euo pipefail

          export GRADLE_USER_HOME="$RUNNER_TEMP/lovemix-gradle-home"

          mkdir -p "$GRADLE_USER_HOME"

          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> "$GITHUB_ENV"

      - name: Verificar Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          ./gradlew --no-daemon --version

          VERSION=$(
            ./gradlew --no-daemon --version |
            grep -m1 '^Gradle ' |
            awk '{print $2}'
          )

          if [ "$VERSION" != "9.3.1" ]; then
            echo "::error::Versão incorreta do Gradle: $VERSION"
            exit 1
          fi

          echo "Gradle 9.3.1 confirmado."

      - name: Configurar Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch android/gradle.properties

          if ! grep -q '^android.suppressUnsupportedCompileSdk=' \
            android/gradle.properties; then
            echo 'android.suppressUnsupportedCompileSdk=37' \
              >> android/gradle.properties
          fi

      - name: Verificar Java e Flutter
        shell: bash
        run: |
          set -euo pipefail

          java -version
          flutter --version

      - name: Baixar dependências Flutter
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      - name: Analisar código Flutter
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Configurar assinatura do APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then

            echo "::warning::Secrets ausentes. Será usada assinatura debug."
            exit 0
          fi

          mkdir -p "$PROJECT_DIR/android/keystore"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > \
            "$PROJECT_DIR/android/keystore/lovemix-release.jks"

          test -s "$PROJECT_DIR/android/keystore/lovemix-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$PROJECT_DIR/android/keystore/lovemix-release.jks" >> "$GITHUB_ENV"

          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Confirmar Gradle antes da compilação
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          ./gradlew --no-daemon --version

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk --release

      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK não encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          cp "$APK" "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

          echo "APK validado."

      - name: Verificar SHA-1 e SHA-256
        id: certificate
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK não encontrado."
            exit 1
          fi

          APKSIGNER=$(
            find "$SDK/build-tools" \
              -type f -name apksigner |
              sort -V |
              tail -n 1
          )

          if [ -z "$APKSIGNER" ]; then
            echo "::error::Apksigner não encontrado."
            exit 1
          fi

          CERTS=$(
            "$APKSIGNER" verify --print-certs \
              "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"
          )

          SHA1=$(
            echo "$CERTS" |
            grep -m1 'certificate SHA-1 digest' |
            awk '{print $NF}'
          )

          SHA256=$(
            echo "$CERTS" |
            grep -m1 'certificate SHA-256 digest' |
            awk '{print $NF}'
          )

          APK_SHA256=$(
            sha256sum "$GITHUB_WORKSPACE/apk-final/LoveMix.apk" |
            awk '{print $1}'
          )

          if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
            echo "::error::Não foi possível obter as impressões digitais."
            exit 1
          fi

          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          echo "SHA-1: $SHA1"
          echo "SHA-256: $SHA256"
          echo "APK SHA-256: $APK_SHA256"

      - name: Publicar APK para download
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: apk-final/LoveMix.apk
          if-no-files-found: error
          retention-days: 14

      - name: Mostrar download e SHA no Summary
        shell: bash
        env:
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
          SHA1: ${{ steps.certificate.outputs.sha1 }}
          SHA256: ${{ steps.certificate.outputs.sha256 }}
          APK_SHA256: ${{ steps.certificate.outputs.apk_sha256 }}
        run: |
          set -euo pipefail

          {
            echo "# 🟣 LoveMix"
            echo ""
            echo "## 🖤 APK Release compilado com sucesso"
            echo ""
            echo "### 📥 Download"
            echo ""
            echo "[**⬇️ BAIXAR LOVE MIX APK**]($APK_URL)"
            echo ""
            echo "### 🔐 Certificado digital"
            echo ""
            echo "**SHA-1**"
            echo ""
            echo "\`$SHA1\`"
            echo ""
            echo "**SHA-256**"
            echo ""
            echo "\`$SHA256\`"
            echo ""
            echo "### 📦 Arquivo APK"
            echo ""
            echo "**SHA-256 do APK:**"
            echo ""
            echo "\`$APK_SHA256\`"
            echo ""
            echo "---"
            echo "LoveMix - Compilação concluída."
          } >> "$GITHUB_STEP_SUMMARY"
