
name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'lovemix_pronto_para_compilar.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extrair projeto LoveMix
        run: |
          unzip -q lovemix_pronto_para_compilar.zip -d extraido
          cp -a extraido/lovemix_flutter/. .

      - name: Criar arquivos Android
        run: flutter create . --platforms=android
      - name: Corrigir Desugaring Android
        run: |
        
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          kts = p.exists()

          if not kts:
              p = Path("android/app/build.gradle")

          s = p.read_text()

          if kts:
              flag = "isCoreLibraryDesugaringEnabled = true"
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              flag = "coreLibraryDesugaringEnabled true"
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if flag not in s:
              m = re.search(r'compileOptions\s*\{', s)
              if not m:
                  raise Exception("compileOptions não encontrado")
              s = s[:m.end()] + "\n        " + flag + s[m.end():]

              
           if dep not in s:
              m = re.search(r'(?m)^(\s*)dependencies\s*\{', s)
              if not m:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"
              else:
                  s = s[:m.end()] + "\n    " + dep + s[m.end():]


  
                
    

          p.write_text(s)
          print("Desugaring ativado com sucesso!")
          PY
      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: lovemix-apk
          path: build/app/outputs/flutter-apk/app-release.apk
