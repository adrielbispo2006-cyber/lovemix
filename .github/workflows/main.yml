
name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'lovemix_pronto_para_compilar.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extrair projeto LoveMix
        run: |
          unzip -q lovemix_pronto_para_compilar.zip -d extraido
          cp -a extraido/lovemix_flutter/. .

      - name: Criar arquivos Android
        run: flutter create . --platforms=android
      
      - name: Corrigir Desugaring Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          kts = p.exists()

          if not kts:
              p = Path("android/app/build.gradle")

          s = p.read_text()

          if kts:
              flag = "isCoreLibraryDesugaringEnabled = true"
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              flag = "coreLibraryDesugaringEnabled true"
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if flag not in s:
              pos = s.find("compileOptions {")
              if pos == -1:
                  raise Exception("compileOptions nao encontrado")
              pos += len("compileOptions {")
              s = s[:pos] + "\n        " + flag + s[pos:]

          if dep not in s:
              s += "\n\ndependencies {\n    " + dep + "\n}\n"

              p.write_text(s)
             print("Desugaring configurado!")
            PY

          - name: Instalar dependências
       run: flutter pub get
      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: lovemix-apk
          path: build/app/outputs/flutter-apk/app-release.apk
