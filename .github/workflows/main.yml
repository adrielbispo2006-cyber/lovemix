name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "functions/**"
      - "SUPABASE_SETUP.sql"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar o projeto Flutter no repositório
        run: |
          if [ -f pubspec.yaml ] && [ -f lib/main.dart ]; then
            echo "Projeto encontrado na raiz do repositório."
            exit 0
          fi
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [ -f "$d/lib/main.dart" ]; then
              echo "Projeto encontrado na subpasta: $d (copiando para a raiz)"
              cp -a "$d"/. .
              exit 0
            fi
          done < <(find . -maxdepth 4 -name pubspec.yaml -not -path './.git/*' -not -path '*/node_modules/*' | sort)
          
          while IFS= read -r z; do
            if unzip -l "$z" 2>/dev/null | grep -q 'pubspec.yaml'; then
              rm -rf /tmp/proj_zip && mkdir -p /tmp/proj_zip
              unzip -q "$z" -d /tmp/proj_zip || continue
              while IFS= read -r f; do
                d="$(dirname "$f")"
                if [ -f "$d/lib/main.dart" ]; then
                  echo "Projeto encontrado dentro do zip: $z (extraindo para a raiz)"
                  cp -a "$d"/. .
                  exit 0
                fi
              done < <(find /tmp/proj_zip -maxdepth 3 -name pubspec.yaml | sort)
            fi
          done < <(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | sort -r)
          
          echo "::error::Não encontrei o projeto Flutter (pubspec.yaml + lib/main.dart) em nenhum lugar do repositório."
          exit 1

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar APK release
        run: flutter build apk --release --no-shrink --split-per-abi --target-platform android-arm,android-arm64

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: lovemix-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

