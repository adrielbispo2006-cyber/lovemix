
name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip curl

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -iname '*.zip' | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Deixe somente um ZIP na raiz do repositório."
            exit 1
          fi

          unzip -t "${ZIPS[0]}"

          mkdir -p extracted
          unzip -q "${ZIPS[0]}" -d extracted

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -s "$DIR/lib/main.dart" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find extracted -type f -name pubspec.yaml -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Flutter não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado: $PROJECT_DIR"

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          for FILE in \
            pubspec.yaml \
            lib/main.dart \
            android/settings.gradle \
            android/app/build.gradle \
            android/app/src/main/AndroidManifest.xml
          do
            if [ ! -s "$FILE" ]; then
              echo "::error::Arquivo ausente: $FILE"
              exit 1
            fi
          done

          echo "Arquivos principais encontrados."

      - name: Preparar Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail

          VERSION="9.3.1"
          DOWNLOAD_DIR="$RUNNER_TEMP/lovemix-gradle"

          mkdir -p "$DOWNLOAD_DIR"

          echo "Baixando Gradle $VERSION..."

          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o "$DOWNLOAD_DIR/gradle.zip"

          unzip -q "$DOWNLOAD_DIR/gradle.zip" -d "$DOWNLOAD_DIR"

          GRADLE="$DOWNLOAD_DIR/gradle-${VERSION}/bin/gradle"

          if [ ! -x "$GRADLE" ]; then
            echo "::error::Executável Gradle não encontrado."
            exit 1
          fi

          "$GRADLE" --version

          echo "GRADLE_BOOTSTRAP=$GRADLE" >> "$GITHUB_ENV"

      - name: Gerar Gradle Wrapper completo
        shell: bash
        run: |
          set -euo pipefail

          BOOTSTRAP_DIR="$RUNNER_TEMP/lovemix-wrapper-bootstrap"

          mkdir -p "$BOOTSTRAP_DIR"

          cd "$BOOTSTRAP_DIR"

          printf "rootProject.name = 'lovemix-wrapper'\n" > settings.gradle
          printf "\n" > build.gradle

          "$GRADLE_BOOTSTRAP" \
            --no-daemon \
            wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          echo "Arquivos gerados:"
          find "$BOOTSTRAP_DIR" -type f -print

          WRAPPER_JAR="$(find "$BOOTSTRAP_DIR" \
            -type f -name gradle-wrapper.jar -print -quit)"

          if [ -z "$WRAPPER_JAR" ] || [ ! -s "$WRAPPER_JAR" ]; then
            echo "::error::Não foi possível gerar gradle-wrapper.jar."
            exit 1
          fi

          TARGET="$PROJECT_DIR/android"

          mkdir -p "$TARGET/gradle/wrapper"

          cp "$BOOTSTRAP_DIR/gradlew" "$TARGET/gradlew"
          cp "$BOOTSTRAP_DIR/gradlew.bat" "$TARGET/gradlew.bat"

          cp "$WRAPPER_JAR" \
            "$TARGET/gradle/wrapper/gradle-wrapper.jar"

          cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.properties" \
            "$TARGET/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$TARGET/gradlew"

          echo "Wrapper copiado com sucesso."

      - name: Conferir configuração do Wrapper
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$PROJECT_DIR/android"
          WRAPPER="$TARGET/gradle/wrapper/gradle-wrapper.properties"
          JAR="$TARGET/gradle/wrapper/gradle-wrapper.jar"

          echo "Conferindo propriedades:"
          cat "$WRAPPER"

          if ! grep -Fq 'gradle-9.3.1-bin.zip' "$WRAPPER"; then
            echo "::error::Endereço do Gradle incorreto."
            exit 1
          fi

          if [ ! -s "$JAR" ]; then
            echo "::error::gradle-wrapper.jar ausente ou vazio."
            exit 1
          fi

          if [ ! -s "$TARGET/gradlew" ]; then
            echo "::error::Executável gradlew ausente."
            exit 1
          fi

          echo "Todos os arquivos do Wrapper estão presentes."

      - name: Verificar versão real do Gradle
        shell: bash
        run: |
          set -euo pipefail

          export GRADLE_USER_HOME="$RUNNER_TEMP/lovemix-gradle-home"

          mkdir -p "$GRADLE_USER_HOME"

          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> "$GITHUB_ENV"

          cd "$PROJECT_DIR/android"

          ./gradlew --no-daemon --version

          VERSION="$(
            ./gradlew --no-daemon --version |
            grep -m1 '^Gradle ' |
            awk '{print $2}'
          )"

          echo "Versão encontrada: $VERSION"

          if [ "$VERSION" != "9.3.1" ]; then
            echo "::error::Esperado Gradle 9.3.1, encontrado $VERSION."
            exit 1
          fi

          echo "Gradle 9.3.1 confirmado."

      - name: Configurar Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch android/gradle.properties

          if ! grep -q '^android.suppressUnsupportedCompileSdk=' android/gradle.properties; then
            echo 'android.suppressUnsupportedCompileSdk=37' >> android/gradle.properties
          fi

      - name: Configurar assinatura do APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then

            echo "::warning::Secrets não configurados. Será usada assinatura debug."
            exit 0
          fi

          mkdir -p "$PROJECT_DIR/android/keystore"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > \
            "$PROJECT_DIR/android/keystore/lovemix-release.jks"

          test -s "$PROJECT_DIR/android/keystore/lovemix-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/$PROJECT_DIR/android/keystore/lovemix-release.jks" >> "$GITHUB_ENV"

          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verificar Java e Flutter
        shell: bash
        run: |
          set -euo pipefail

          java -version
          flutter --version

      - name: Baixar dependências Flutter
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      - name: Analisar código Flutter
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Confirmar Gradle antes da compilação
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          ./gradlew --no-daemon --version

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk --release

      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK não encontrado ou vazio."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          cp "$APK" "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

      - name: Verificar certificado
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK não encontrado."
            exit 1
          fi

          APKSIGNER="$(find "$SDK/build-tools" \
            -type f -name apksigner | sort -V | tail -1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::Apksigner não encontrado."
            exit 1
          fi

          CERTS="$("$APKSIGNER" verify --print-certs \
            "$GITHUB_WORKSPACE/apk-final/LoveMix.apk")"

          SHA1="$(echo "$CERTS" |
            grep -m1 'certificate SHA-1 digest' | awk '{print $NF}')"

          SHA256="$(echo "$CERTS" |
            grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"

          {
            echo "## Certificado LoveMix"
            echo ""
            echo "SHA-1: $SHA1"
            echo ""
            echo "SHA-256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SHA-1: $SHA1"
          echo "SHA-256: $SHA256"

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: apk-final/LoveMix.apk
          if-no-files-found: error
          retention-days: 14
