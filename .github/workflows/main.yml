
name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Extrair ZIP atualizado
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado na raiz."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERRO: pubspec.yaml não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Projeto Flutter: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Baixar dependências Flutter
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Verificar versão Flutter
        run: |
          flutter --version

      - name: Gerar APK Release
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Localizar APK
        run: |
          APK=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: apk-final/LoveMix.apk
          if-no-files-found: error
          retention-days: 7
