
name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip curl python3

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -iname '*.zip' | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Deixe somente um ZIP na raiz do repositório."
            exit 1
          fi

          unzip -t "${ZIPS[0]}"

          mkdir -p extracted
          unzip -q "${ZIPS[0]}" -d extracted

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -s "$DIR/lib/main.dart" ] &&
               [ -d "$DIR/android" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find extracted -type f -name pubspec.yaml -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Flutter completo não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -s pubspec.yaml
          test -s lib/main.dart
          test -s android/app/src/main/AndroidManifest.xml

          if [ ! -s android/settings.gradle ] &&
             [ ! -s android/settings.gradle.kts ]; then
            echo "::error::Arquivo settings.gradle ausente."
            exit 1
          fi

          if [ ! -s android/app/build.gradle ] &&
             [ ! -s android/app/build.gradle.kts ]; then
            echo "::error::Arquivo app/build.gradle ausente."
            exit 1
          fi

          echo "Arquivos principais confirmados."

      - name: Atualizar Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/android" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])

          files = list(root.rglob("*.gradle"))
          files += list(root.rglob("*.gradle.kts"))

          for path in files:
              text = path.read_text(encoding="utf-8")
              original = text

              text = re.sub(
                  r'(id\s*\(?\s*["\']com\.android\.(?:application|library)["\']\s*\)?\s*version\s*["\'])[^"\']+',
                  r'\g<1>9.1.1',
                  text
              )

              text = re.sub(
                  r'(com\.android\.tools\.build:gradle:)'
                  r'[\d.]+(?:-[A-Za-z0-9.-]+)?',
                  r'\g<1>9.1.1',
                  text
              )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print("Plugin atualizado:", path)

          print("Verificação do Android Gradle Plugin concluída.")
          PY

      - name: Preparar Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail

          VERSION="9.3.1"
          DOWNLOAD_DIR="$RUNNER_TEMP/lovemix-gradle"

          mkdir -p "$DOWNLOAD_DIR"

          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o "$DOWNLOAD_DIR/gradle.zip"

          unzip -q "$DOWNLOAD_DIR/gradle.zip" -d "$DOWNLOAD_DIR"

          GRADLE="$DOWNLOAD_DIR/gradle-${VERSION}/bin/gradle"

          test -x "$GRADLE"

          "$GRADLE" --version

          echo "GRADLE_BOOTSTRAP=$GRADLE" >> "$GITHUB_ENV"

      - name: Gerar Gradle Wrapper automaticamente
        shell: bash
        run: |
          set -euo pipefail

          BOOTSTRAP_DIR="$RUNNER_TEMP/lovemix-wrapper"

          mkdir -p "$BOOTSTRAP_DIR"

          cd "$BOOTSTRAP_DIR"

          printf "rootProject.name = 'lovemix-wrapper'\n" > settings.gradle
          printf "\n" > build.gradle

          "$GRADLE_BOOTSTRAP" \
            --no-daemon \
            wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          TARGET="$PROJECT_DIR/android"

          mkdir -p "$TARGET/gradle/wrapper"

          cp "$BOOTSTRAP_DIR/gradlew" "$TARGET/gradlew"
          cp "$BOOTSTRAP_DIR/gradlew.bat" "$TARGET/gradlew.bat"

          cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.jar" \
            "$TARGET/gradle/wrapper/gradle-wrapper.jar"

          cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.properties" \
            "$TARGET/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$TARGET/gradlew"

          echo "Gradle Wrapper instalado."

      - name: Confirmar configuração do Wrapper
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$PROJECT_DIR/android"

          WRAPPER="$TARGET/gradle/wrapper/gradle-wrapper.properties"
          JAR="$TARGET/gradle/wrapper/gradle-wrapper.jar"

          test -s "$TARGET/gradlew"
          test -s "$JAR"
          test -s "$WRAPPER"

          cat "$WRAPPER"

          # Não comparar a URL completa:
          # Gradle pode gravar https\:// no arquivo.
          if ! grep -Fq 'gradle-9.3.1-bin.zip' "$WRAPPER"; then
            echo "::error::Versão incorreta do Gradle Wrapper."
            exit 1
          fi

          echo "Wrapper confirmado."

      - name: Preparar cache Gradle
        shell: bash
        run: |
          set -euo pipefail

          export GRADLE_USER_HOME="$RUNNER_TEMP/lovemix-gradle-home"

          mkdir -p "$GRADLE_USER_HOME"

          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> "$GITHUB_ENV"

      - name: Verificar Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          ./gradlew --no-daemon --version | tee "$RUNNER_TEMP/gradle-version.txt"

          VERSION="$(grep -m1 '^Gradle ' \
            "$RUNNER_TEMP/gradle-version.txt" | awk '{print $2}')"

          if [ "$VERSION" != "9.3.1" ]; then
            echo "::error::Versão Gradle incorreta: $VERSION"
            exit 1
          fi

          echo "Gradle 9.3.1 confirmado."

      - name: Configurar Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch android/gradle.properties

          if ! grep -q '^android.suppressUnsupportedCompileSdk=' \
            android/gradle.properties; then
            echo 'android.suppressUnsupportedCompileSdk=37' \
              >> android/gradle.properties
          fi

      - name: Verificar Java e Flutter
        shell: bash
        run: |
          set -euo pipefail

          java -version
          flutter --version

      - name: Baixar dependências Flutter
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      - name: Analisar código Flutter
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Configurar assinatura do APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] ||
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] ||
             [ -z "${ANDROID_KEY_ALIAS:-}" ] ||
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then

            echo "::warning::Secrets ausentes. Será utilizada a assinatura configurada no projeto."
            exit 0
          fi

          mkdir -p "$PROJECT_DIR/android/keystore"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > \
            "$PROJECT_DIR/android/keystore/lovemix-release.jks"

          test -s "$PROJECT_DIR/android/keystore/lovemix-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$PROJECT_DIR/android/keystore/lovemix-release.jks" >> "$GITHUB_ENV"

          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk --release

      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK não encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          cp "$APK" "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

      - name: Verificar SHA-1 e SHA-256
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK não encontrado."
            exit 1
          fi

          APKSIGNER="$(find "$SDK/build-tools" \
            -type f -name apksigner | sort -V | tail -1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::Apksigner não encontrado."
            exit 1
          fi

          APK="$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"

          SHA1="$(echo "$CERTS" |
            grep -m1 -i 'certificate SHA-1 digest' |
            sed 's/.*: //')"

          SHA256="$(echo "$CERTS" |
            grep -m1 -i 'certificate SHA-256 digest' |
            sed 's/.*: //')"

          if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
            echo "::error::Não foi possível obter as assinaturas."
            exit 1
          fi

          echo "LOVE_SHA1=$SHA1" >> "$GITHUB_ENV"
          echo "LOVE_SHA256=$SHA256" >> "$GITHUB_ENV"

          echo "SHA-1: $SHA1"
          echo "SHA-256: $SHA256"

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: apk-final/LoveMix.apk
          if-no-files-found: error
          retention-days: 14

      - name: Criar Release para download
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lovemix-${{ github.run_number }}
          name: LoveMix APK - Build ${{ github.run_number }}
          body: |
            ## LoveMix APK

            APK compilado automaticamente pelo GitHub Actions.

            SHA-1: ${{ env.LOVE_SHA1 }}

            SHA-256: ${{ env.LOVE_SHA256 }}
          files: apk-final/LoveMix.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Mostrar download e SHA no Summary
        shell: bash
        env:
          SHA1: ${{ env.LOVE_SHA1 }}
          SHA256: ${{ env.LOVE_SHA256 }}
        run: |
          set -euo pipefail

          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/lovemix-${{ github.run_number }}/LoveMix.apk"

          ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "# LoveMix - APK compilado"
            echo ""
            echo "## Download"
            echo ""
            echo "[BAIXAR LOVE MIX APK]($RELEASE_URL)"
            echo ""
            echo "[Ver artefatos do GitHub Actions]($ARTIFACT_URL)"
            echo ""
            echo "## Assinatura digital"
            echo ""
            echo "### SHA-1"
            echo ""
            echo "\`$SHA1\`"
            echo ""
            echo "### SHA-256"
            echo ""
            echo "\`$SHA256\`"
            echo ""
            echo "## Resultado"
            echo ""
            echo "APK validado e publicado com sucesso."
          } >> "$GITHUB_STEP_SUMMARY"
