      - name: Verificar código Dart
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 && ok=1 || ok=0
          echo "$(grep -c -E '^\s*error •' analyze.log || true) erro(s) de código encontrados."
          if [ "$ok" -ne 1 ]; then
            echo "=============== ERROS (só os que impedem o build) ==============="
