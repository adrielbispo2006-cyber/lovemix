
name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' | sort)

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Deixe somente um ZIP na raiz do GitHub."
            exit 1
          fi

          unzip -t "${ZIPS[0]}"
          mkdir -p extracted
          unzip -q "${ZIPS[0]}" -d extracted

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -s "$DIR/lib/main.dart" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name pubspec.yaml -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Flutter não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Verificar arquivos obrigatórios
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -s pubspec.yaml
          test -s lib/main.dart
          test -s android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/app/src/main/AndroidManifest.xml

          chmod +x android/gradlew

      - name: Atualizar Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"

          cat > "$WRAPPER" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=120000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Conferindo arquivo Gradle:"
          cat "$WRAPPER"

          grep -q 'gradle-9.3.1-bin.zip' "$WRAPPER"

      - name: Confirmar versão do Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "Executando Gradle Wrapper:"
          ./gradlew --version

          VERSION="$(./gradlew --version | grep -m1 '^Gradle ' | awk '{print $2}')"

          echo "Versão detectada: $VERSION"

          if [ "$VERSION" != "9.3.1" ]; then
            echo "::error::A versão do Gradle não é 9.3.1."
            exit 1
          fi

          echo "Gradle correto confirmado."

      - name: Configurar Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch android/gradle.properties

          if ! grep -q '^android.suppressUnsupportedCompileSdk=' android/gradle.properties; then
            echo 'android.suppressUnsupportedCompileSdk=37' >> android/gradle.properties
          fi

      - name: Configurar assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::warning::Assinatura fixa não configurada. Será usada a assinatura debug."
            exit 0
          fi

          mkdir -p "$PROJECT_DIR/android/keystore"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | \
            base64 --decode > "$PROJECT_DIR/android/keystore/lovemix-release.jks"

          test -s "$PROJECT_DIR/android/keystore/lovemix-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/$PROJECT_DIR/android/keystore/lovemix-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verificar ambiente
        run: |
          flutter --version
          java -version

      - name: Baixar dependências
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analisar Flutter
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK não foi gerado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          cp "$APK" "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

      - name: Verificar certificado
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK não encontrado."
            exit 1
          fi

          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::Apksigner não encontrado."
            exit 1
          fi

          CERTS="$("$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/apk-final/LoveMix.apk")"

          SHA1="$(echo "$CERTS" | grep -m1 'certificate SHA-1 digest' | awk '{print $NF}')"
          SHA256="$(echo "$CERTS" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"

          {
            echo "## Certificado LoveMix"
            echo ""
            echo "SHA-1: $SHA1"
            echo ""
            echo "SHA-256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: apk-final/LoveMix.apk
          if-no-files-found: error
          retention-days: 14
