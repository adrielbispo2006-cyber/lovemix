name: Gerar APK LoveMix

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Preparar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparando Android SDK..."
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" \vert{}\vert{} ! -f "$SDKMANAGER" ]]; then
            echo "::error::SDK Manager não encontrado."
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/platform-tools"
          echo "Android SDK 35 instalado!"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip curl jq file python3

      - name: Localizar projeto LoveMix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          if [[ -f "$GITHUB_WORKSPACE/pubspec.yaml" && -f "$GITHUB_WORKSPACE/lib/main.dart" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Nenhum ZIP encontrado."
              exit 1
            fi
            echo "Extraindo: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"
            PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -not -path '*/build/*' | head -n 1)"
            if [[ -z "$PUBSPEC" ]]; then
              echo
