name: Gerar APK LoveMix

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' | sort)

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Deixe somente um ZIP na raiz. Encontrados: ${#ZIPS[@]}"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          unzip -t "${ZIPS[0]}"

          mkdir -p extracted
          unzip -q "${ZIPS[0]}" -d extracted

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -s "$DIR/lib/main.dart" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name pubspec.yaml -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Flutter não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT_DIR"

      - name: Verificar arquivos obrigatórios
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          for FILE in \
            pubspec.yaml \
            lib/main.dart \
            android/gradlew \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/app/src/main/AndroidManifest.xml
          do
            if [ ! -s "$FILE" ]; then
              echo "::error::Arquivo ausente: $FILE"
              exit 1
            fi
          done

          chmod +x android/gradlew

      - name: Corrigir todos os arquivos Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mapfile -t WRAPPERS < <(
            find android -type f -name gradle-wrapper.properties
          )

          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::Gradle Wrapper não encontrado."
            exit 1
          fi

          for WRAPPER in "${WRAPPERS[@]}"; do
            cat > "$WRAPPER" <<'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

            echo "Arquivo corrigido: $WRAPPER"
            cat "$WRAPPER"

            grep -q 'gradle-9.3.1-bin.zip' "$WRAPPER"
          done

          chmod +x android/gradlew

      - name: Verificar versão real do Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          echo "Verificando Gradle Wrapper..."

          ./gradlew --version

          VERSION="$(./gradlew --version | grep -m1 '^Gradle ' | awk '{print $2}')"

          echo "Versão encontrada: $VERSION"

          if [ "$VERSION" != "9.3.1" ]; then
            echo "::error::Gradle incorreto: $VERSION. Esperado: 9.3.1"
            exit 1
          fi

          echo "Gradle 9.3.1 confirmado."

      - name: Permitir compileSdk 37
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch android/gradle.properties

          if ! grep -q '^android.suppressUnsupportedCompileSdk=' android/gradle.properties; then
            echo 'android.suppressUnsupportedCompileSdk=37' >> android/gradle.properties
          fi

      - name: Configurar assinatura fixa do APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then

            echo "::warning::Secrets de assinatura não configurados. Será utilizada a chave debug."
            exit 0
          fi

          mkdir -p "$PROJECT_DIR/android/keystore"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | \
            base64 --decode > "$PROJECT_DIR/android/keystore/lovemix-release.jks"

          test -s "$PROJECT_DIR/android/keystore/lovemix-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/$PROJECT_DIR/android/keystore/lovemix-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verificar ambiente
        shell: bash
        run: |
          flutter --version
          java -version

      - name: Baixar dependências Flutter
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      - name: Analisar código Flutter
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk --release

      - name: Localizar e validar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK não encontrado ou vazio."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          cp "$APK" "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

          echo "APK encontrado:"
          ls -lh "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

      - name: Mostrar SHA-1 e SHA-256 do certificado
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK não encontrado."
            exit 1
          fi

          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::Apksigner não encontrado."
            exit 1
          fi

          CERTS="$("$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/apk-final/LoveMix.apk")"

          fmt() {
            echo "$1" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//'
          }

          SHA1="$(fmt "$(echo "$CERTS" | grep -m1 'certificate SHA-1 digest' | awk '{print $NF}')")"

          SHA256="$(fmt "$(echo "$CERTS" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')")"

          {
            echo "## Certificado LoveMix"
            echo ""
            echo "SHA-1: $SHA1"
            echo ""
            echo "SHA-256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SHA-1: $SHA1"
          echo "SHA-256: $SHA256"

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: apk-final/LoveMix.apk
          if-no-files-found: error
          retention-days: 14

