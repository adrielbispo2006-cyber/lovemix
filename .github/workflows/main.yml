
name: Gerar APK LoveMix

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Baixar projeto
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter estável
      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Android SDK
      # CORREÇÃO: não instalar o pacote antigo "tools"
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 5. Preparar SDK 35
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparando Android SDK..."

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          if [[ -z "$SDKMANAGER" || ! -f "$SDKMANAGER" ]]; then
            echo "::error::SDK Manager não encontrado."
            exit 1
          fi

          echo "Aceitando licenças..."

          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          echo "Instalando Android SDK 35..."

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "Validando SDK..."

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/platform-tools"

          echo "Android SDK 35 instalado!"

      # 6. Ferramentas
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip curl jq file python3

      # 7. Localizar projeto
      - name: Localizar projeto LoveMix
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          if [[ -f "$GITHUB_WORKSPACE/pubspec.yaml" && -f "$GITHUB_WORKSPACE/lib/main.dart" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else

            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Nenhum ZIP encontrado."
              exit 1
            fi

            echo "Extraindo: $ZIP_FILE"

            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

            PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" \
              -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' | head -n 1)"

            if [[ -z "$PUBSPEC" ]]; then
              echo "::error::pubspec.yaml não encontrado."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"

          test -f "$PROJECT_DIR/android/app/build.gradle" || \
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"

          test -f "$PROJECT_DIR/android/settings.gradle" || \
          test -f "$PROJECT_DIR/android/settings.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado: $PROJECT_DIR"

      # 8. Corrigir compileSdk 35
      - name: Corrigir compileSdk para Android 35
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          root = Path(os.environ["PROJECT_DIR"])
          android = root / "android" / "app"

          candidates = [
              android / "build.gradle",
              android / "build.gradle.kts"
          ]

          gradle_file = next(
              (p for p in candidates if p.is_file()),
              None
          )

          if gradle_file is None:
              print("::error::build.gradle não encontrado.")
              sys.exit(1)

          content = gradle_file.read_text()

          replacement = (
              "compileSdk = 35"
              if gradle_file.suffix == ".kts"
              else "compileSdk 35"
          )

          patterns = [
              r'(?m)^(\s*)compileSdkVersion\s+.*$',
              r'(?m)^(\s*)compileSdk\s*=\s*.*$',
              r'(?m)^(\s*)compileSdk\s+.*$'
          ]

          changed = False

          for pattern in patterns:
              if re.search(pattern, content):
                  content = re.sub(
                      pattern,
                      lambda m: m.group(1) + replacement,
                      content,
                      count=1
                  )
                  changed = True
                  break

          if not changed:
              match = re.search(
                  r'(?m)^(\s*)android\s*\{',
                  content
              )

              if not match:
                  print("::error::Bloco android não encontrado.")
                  sys.exit(1)

              indent = match.group(1) + "    "

              content = (
                  content[:match.end()] +
                  "\n" + indent + replacement +
                  content[match.end():]
              )

          gradle_file.write_text(content)

          print("compileSdk configurado para Android 35.")
          print(gradle_file)
          PY

      # 9. Validar SDK
      - name: Validar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK: $ANDROID_HOME"

          echo "Plataformas:"
          ls "$ANDROID_HOME/platforms"

          test -d "$ANDROID_HOME/platforms/android-35"

          echo "Build Tools:"
          ls "$ANDROID_HOME/build-tools"

          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "SDK validado!"

      # 10. Cache Gradle
      - name: Preparar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: lovemix-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.yaml') }}
          restore-keys: |
            lovemix-gradle-${{ runner.os }}-

      # 11. Assinatura persistente
      - name: Configurar assinatura persistente
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Keystore não configurado."
            echo "Utilizando assinatura configurada no projeto."
            exit 0
          fi

          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure todos os secrets ANDROID_*. "
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/lovemix-signing"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/lovemix-signing/release.jks"

          test -s "$RUNNER_TEMP/lovemix-signing/release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lovemix-signing/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "Assinatura persistente preparada."

      # 12. Dependências Flutter
      - name: Baixar dependências Flutter
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

          echo "Dependências instaladas."

      # 13. Corrigir repositórios ZEGO
      - name: Corrigir repositórios dos plugins ZEGO
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          if not cache.exists():
              print("Cache Pub não encontrado.")
              raise SystemExit(0)

          for android_dir in cache.glob("zego_*/android"):

              files = (
                  list(android_dir.glob("*.gradle")) +
                  list(android_dir.glob("*.gradle.kts"))
              )

              for gradle_file in files:

                  original = gradle_file.read_text()

                  content = re.sub(
                      r'\bjcenter\s*\(\s*\)',
                      'mavenCentral()',
                      original
                  )

                  if content != original:
                      gradle_file.write_text(content)
                      print("Corrigido:", gradle_file)

          print("Verificação ZEGO concluída.")
          PY

      # 14. Validar Java Flutter e Gradle
      - name: Validar Java Flutter e Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo "Flutter:"
          flutter --version

          echo "Gradle Wrapper:"

          cd android

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

          echo "Ambiente validado."

      # 15. Compilar APK Release
      - name: Compilar APK Release
        id: build_apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Verificando Android SDK 35..."

          test -d "$ANDROID_HOME/platforms/android-35"

          echo "Compilando LoveMix..."

          flutter build apk --release

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            APK="$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
              -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          fi

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::APK Release não foi gerado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$APK" "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          test -s "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          echo "APK LoveMix gerado com sucesso!"

      # 16. Validar APK
      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          test -s "$APK"

          file "$APK"

          echo "APK validado."

      # 17. SHA-1 e SHA-256
      - name: Calcular SHA-1 SHA-256 e fingerprints
        id: hashes
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          FILE_SHA1="$(sha1sum "$APK" | awk '{print $1}')"
          FILE_SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          CERT_SHA1="Não disponível"
          CERT_SHA256="Não disponível"

          if [[ -n "$APKSIGNER" && -f "$APKSIGNER" ]]; then

            CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"

            CERT_SHA1="$(printf '%s\n' "$CERT_INFO" |
              sed -n 's/.*certificate SHA-1 digest: *//p' | head -n 1)"

            CERT_SHA256="$(printf '%s\n' "$CERT_INFO" |
              sed -n 's/.*certificate SHA-256 digest: *//p' | head -n 1)"

            CERT_SHA1="${CERT_SHA1:-Não disponível}"
            CERT_SHA256="${CERT_SHA256:-Não disponível}"

          else
            echo "::warning::apksigner não encontrado."
          fi

          {
            echo "file_sha1=$FILE_SHA1"
            echo "file_sha256=$FILE_SHA256"
            echo "cert_sha1=$CERT_SHA1"
            echo "cert_sha256=$CERT_SHA256"
          } >> "$GITHUB_OUTPUT"

          {
            echo "LoveMix - Verificação de integridade"
            echo
            echo "APK: LoveMix-release.apk"
            echo
            echo "SHA-1 do arquivo:"
            echo "$FILE_SHA1"
            echo
            echo "SHA-256 do arquivo:"
            echo "$FILE_SHA256"
            echo
            echo "SHA-1 do certificado Firebase/Google:"
            echo "$CERT_SHA1"
            echo
            echo "SHA-256 do certificado Firebase/Google:"
            echo "$CERT_SHA256"
          } > "$GITHUB_WORKSPACE/dist/CHECKSUMS.txt"

          echo "Hashes calculados."

      # 18. Publicar artefato
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: |
            dist/LoveMix-release.apk
            dist/CHECKSUMS.txt
          if-no-files-found: error
          retention-days: 30

      # 19. Preparar Release
      - name: Preparar Release
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="lovemix-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=LoveMix ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # 20. Criar Release
      - name: Criar Release para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            # 💜 LoveMix

            APK Release compilado automaticamente.

            Android SDK: 35.
            Java: 17.

            SHA-1 e SHA-256 do APK e certificado em CHECKSUMS.txt.
          files: |
            dist/LoveMix-release.apk
            dist/CHECKSUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      # 21. Summary LoveMix
      - name: Mostrar download e SHA no Summary
        if: success()
        env:
          FILE_SHA1: ${{ steps.hashes.outputs.file_sha1 }}
          FILE_SHA256: ${{ steps.hashes.outputs.file_sha256 }}
          CERT_SHA1: ${{ steps.hashes.outputs.cert_sha1 }}
          CERT_SHA256: ${{ steps.hashes.outputs.cert_sha256 }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          {
            echo "# 💜 LoveMix"
            echo
            echo "## BUILD CONCLUÍDO COM SUCESSO"
            echo
            echo "### 📥 [BAIXAR APK LOVEMIX]($RELEASE_URL)"
            echo
            echo "### 🔐 SHA-1 do arquivo"
            echo '```text'
            echo "$FILE_SHA1"
            echo '```'
            echo
            echo "### 🔐 SHA-256 do arquivo"
            echo '```text'
            echo "$FILE_SHA256"
            echo '```'
            echo
            echo "### 📱 Certificado Firebase/Google"
            echo
            echo "**SHA-1:**"
            echo '```text'
            echo "$CERT_SHA1"
            echo '```'
            echo
            echo "**SHA-256:**"
            echo '```text'
            echo "$CERT_SHA256"
            echo '```'
            echo
            echo "### 📦 Arquivos publicados"
            echo "- LoveMix-release.apk"
            echo "- CHECKSUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"
