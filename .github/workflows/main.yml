name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <( find . -maxdepth 1 -type f -iname '*.zip' | sort )
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Deixe somente um ZIP do LoveMix na raiz."
            exit 1
          fi
          ZIP_FILE="${ZIPS[0]}"
          unzip -t "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "ZIP extraído com sucesso."

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"
            if [ -s "$DIR/lib/main.dart" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <( find extracted -type f -name pubspec.yaml -print0 )
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Flutter não encontrado."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Verificar arquivos obrigatórios
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          for FILE in \
            pubspec.yaml \
            lib/main.dart \
            android/app/src/main/AndroidManifest.xml
          do
            if [ ! -s "$FILE" ]; then
              echo "::error::Arquivo ausente: $FILE"
              exit 1
            fi
          done
          echo "Arquivos obrigatórios OK."

      - name: Verificar ambiente
        run: |
          flutter --version
          java -version
          flutter doctor -v

      - name: Baixar dependências Flutter
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if ! flutter pub get; then
            echo "::error::Falha nas dependências. Confira o pubspec.yaml e os conflitos entre ZEGO e demais pacotes."
            exit 1
          fi

      - name: Verificar dependências resolvidas
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub deps
          if [ ! -s pubspec.lock ]; then
            echo "::error::pubspec.lock não foi gerado."
            exit 1
          fi

      - name: Analisar código Flutter
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-pub

      - name: Compilar APK Release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Localizar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK não encontrado ou vazio."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"
          echo "APK gerado:"
          ls -lh "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

      - name: Gerar SHA-1 e SHA-256 do APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/apk-final"
          SHA1=$(sha1sum LoveMix.apk | awk '{print $1}')
          SHA256=$(sha256sum LoveMix.apk | awk '{print $1}')
          {
            echo "SHA-1 DO APK:"
            echo "$SHA1"
            echo ""
            echo "SHA-256 DO APK:"
            echo "$SHA256"
          } > checksums.txt
          {
            echo "## LOVE MIX - ASSINATURAS"
            
