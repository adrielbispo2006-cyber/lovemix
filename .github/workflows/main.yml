name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar o projeto Flutter no repositório
        run: |
          if [ -f pubspec.yaml ] && [ -f lib/main.dart ]; then
            echo "Projeto encontrado na raiz do repositório."
            exit 0
          fi

          # 1) Projeto dentro de uma subpasta (ex.: lovemix_work/)
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [ -f "$d/lib/main.dart" ]; then
              echo "Projeto encontrado na subpasta: $d (copiando para a raiz)"
              cp -a "$d"/. .
              exit 0
            fi
          done < <(find . -maxdepth 4 -name pubspec.yaml -not -path './.git/*' -not -path '*/node_modules/*' | sort)

          # 2) Zip do projeto enviado como arquivo para o repositório
          while IFS= read -r z; do
            if unzip -l "$z" 2>/dev/null | grep -q 'pubspec.yaml'; then
              rm -rf /tmp/proj_zip && mkdir -p /tmp/proj_zip
              unzip -q "$z" -d /tmp/proj_zip || continue
              while IFS= read -r f; do
                d="$(dirname "$f")"
                if [ -f "$d/lib/main.dart" ]; then
                  echo "Projeto encontrado dentro do zip: $z (extraindo para a raiz)"
                  cp -a "$d"/. .
                  exit 0
                fi
              done < <(find /tmp/proj_zip -maxdepth 3 -name pubspec.yaml | sort)
            fi
          done < <(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | sort -r)

          echo "::error::Não encontrei o projeto Flutter (pubspec.yaml + lib/main.dart) em nenhum lugar do repositório."
          echo "Conteúdo do repositório:"
          find . -maxdepth 2 -not -path './.git/*' -not -path './.git' | sort | head -60
          exit 1

      - name: Conferir arquivos do projeto no repositório
        run: |
          missing=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ ! -s "$f" ]; then
              echo "FALTANDO no repositório: $f"
              missing=1
            fi
          done <<'LISTA'
          pubspec.yaml
          lib/main.dart
          lib/app.dart
          lib/firebase_options.dart
          lib/screens/admin_screen.dart
          lib/screens/alliance_wall_screen.dart
          lib/screens/auth_screen.dart
          lib/screens/chat_rooms_screen.dart
          lib/screens/chat_screen.dart
          lib/screens/discover_screen.dart
          lib/screens/home_screen.dart
          lib/screens/messages_screen.dart
          lib/screens/post_interactions_screen.dart
          lib/screens/profile_frames_screen.dart
          lib/screens/profile_screen.dart
          lib/screens/profile_view_screen.dart
          lib/screens/ranking_screen.dart
          lib/screens/resources_screen.dart
          lib/screens/stories_widget.dart
          lib/screens/wallet_screen.dart
          lib/screens/zego_live_screen.dart
          lib/services/data_service.dart
          lib/services/notification_service.dart
          lib/services/zego_config.dart
          lib/widgets/profile_frame.dart
          LISTA
          if [ "$missing" -ne 0 ]; then
            echo "::error::Faltam arquivos do projeto no GitHub (lista acima). Envie esses arquivos nas mesmas pastas do zip e rode de novo."
            exit 1
          fi
          echo "Todos os arquivos de código estão no repositório."
          for f in assets/icon/lovemix.png assets/lovemix_launcher.png assets/lovemix_couple.jpg; do
            [ -s "$f" ] && echo "OK: $f" || echo "::warning::Imagem ausente: $f (o workflow tenta achar ou criar uma substituta)."
          done

      - name: Aplicar correções de código conhecidas (Dart)
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          def edit(path, pairs):
              f = Path(path)
              if not f.exists():
                  print(f"Pulando (não existe): {path}")
                  return
              t = f.read_text()
              changed = False
              for old, new in pairs:
                  if old in t:
                      t = t.replace(old, new)
                      changed = True
              if changed:
                  f.write_text(t)
                  print(f"Corrigido: {path}")
              else:
                  print(f"Já estava correto: {path}")

          # 1) Parêntese sobrando no GridView.builder da tela de interações.
          edit("lib/screens/zego_live_screen.dart", [(
              "                }),\n              ),\n              const SizedBox(height: 14),\n"
              "              SizedBox(width: double.infinity, child: ElevatedButton.icon(",
              "                },\n              ),\n              const SizedBox(height: 14),\n"
              "              SizedBox(width: double.infinity, child: ElevatedButton.icon(",
          )])

          # 2) flutter_local_notifications 20+: initialize/show usam parâmetros nomeados.
          edit("lib/services/notification_service.dart", [
              ("await _local.initialize(settings);", "await _local.initialize(settings: settings);"),
              ("await _local.show(\n      message.hashCode,\n      title,\n      body,\n      NotificationDetails(",
               "await _local.show(\n      id: message.hashCode,\n      title: title,\n      body: body,\n      notificationDetails: NotificationDetails("),
          ])
          PYCODE

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar estrutura Android
        run: flutter create . --platforms=android

      - name: Fixar versões compatíveis do Android Gradle Plugin e Kotlin
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          # Flutter mais recente pode criar o projeto com AGP 9.x. Os plugins
          # ZEGO usados neste app ainda precisam do fluxo Kotlin/Gradle legado.
          candidates = [Path("android/settings.gradle.kts"), Path("android/settings.gradle")]
          settings = next((p for p in candidates if p.exists()), None)
          if settings is None:
              raise SystemExit("ERRO: não encontrei android/settings.gradle(.kts).")

          content = settings.read_text()
          patterns = [
              (r'(id\("com\.android\.application"\)\s+version\s+")[^\"]+(")', r'\g<1>8.13.0\g<2>'),
              (r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^\"]+(")', r'\g<1>2.2.20\g<2>'),
              (r"(id\s+['\"]com\.android\.application['\"]\s+version\s+['\"])[^'\"]+(['\"])", r'\g<1>8.13.0\g<2>'),
              (r"(id\s+['\"]org\.jetbrains\.kotlin\.android['\"]\s+version\s+['\"])[^'\"]+(['\"])", r'\g<1>2.2.20\g<2>'),
          ]
          for pattern, repl in patterns:
              content = re.sub(pattern, repl, content)

          # Se a versão ainda não existir, insere os plugins no bloco plugins.
          if not re.search(r'com\.android\.application.*version.*8\.13\.0', content):
              content = re.sub(r'plugins\s*\{', 'plugins {\n    id("com.android.application") version "8.13.0" apply false', content, count=1)
          if not re.search(r'org\.jetbrains\.kotlin\.android.*version.*2\.2\.20', content):
              content = re.sub(r'plugins\s*\{', 'plugins {\n    id("org.jetbrains.kotlin.android") version "2.2.20" apply false', content, count=1)
          settings.write_text(content)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("ERRO: gradle-wrapper.properties não encontrado.")
          w = wrapper.read_text()
          w = re.sub(r'^distributionUrl=.*$', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip', w, flags=re.M)
          if "distributionUrl=" not in w:
              w += "\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip\n"
          wrapper.write_text(w)

          # Confirma explicitamente que AGP 9/Gradle 9 não ficaram ativos.
          final_settings = settings.read_text()
          if "8.13.0" not in final_settings or "2.2.20" not in final_settings:
              raise SystemExit("ERRO: não consegui fixar AGP 8.13.0 e Kotlin 2.2.20.")
          if "gradle-8.14.3-bin.zip" not in wrapper.read_text():
              raise SystemExit("ERRO: não consegui fixar Gradle 8.14.3.")
          print(f"Configuração aplicada em {settings}: AGP 8.13.0 + Kotlin 2.2.20 + Gradle 8.14.3.")
          PYCODE

      - name: Configurar permissões de câmera e microfone para ZEGOCLOUD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Gradle Android não encontrado.")
          s = gradle.read_text()
          s = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s, count=1)
          gradle.write_text(s)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              'android.permission.INTERNET',
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
          ]
          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}"/>'
              if tag not in content:
                  content = content.replace('<application', tag + '\n    <application', 1)
          manifest.write_text(content)
          print("compileSdk 36 e permissões de câmera/microfone configurados.")
          PY

      - name: Forçar compileSdk 36 em todos os plugins (corrige ZEGO android-31)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle.kts")
          if not root.exists():
              raise SystemExit("ERRO: android/build.gradle.kts não encontrado.")
          s = root.read_text()
          if "LOVEMIX_FORCE_COMPILE_SDK" not in s:
              s += """

          // LOVEMIX_FORCE_COMPILE_SDK
          // Plugins antigos (ZEGO etc.) declaram compileSdk 31, mas as dependências
          // AndroidX atuais exigem 33+. Força 36 em todos os módulos Android.
          subprojects {
              val forceSdk: Project.() -> Unit = {
                  val androidExt = extensions.findByName("android")
                  if (androidExt is com.android.build.gradle.BaseExtension) {
                      androidExt.compileSdkVersion(36)
                  }
              }
              if (state.executed) {
                  forceSdk()
              } else {
                  afterEvaluate { forceSdk() }
              }
          }
          """
              root.write_text(s)
          print("compileSdk 36 forçado em todos os subprojetos.")
          PY

      - name: Otimizar download do Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("Não encontrei gradle-wrapper.properties após criar o projeto Android.")
          content = wrapper.read_text()
          content = re.sub(r'gradle-([0-9.]+)-all\.zip', r'gradle-\1-bin.zip', content)
          if "networkTimeout=" in content:
              content = re.sub(r'networkTimeout=\d+', 'networkTimeout=120000', content)
          else:
              content += "\nnetworkTimeout=120000\n"
          wrapper.write_text(content)
          print("Gradle configurado para baixar o pacote binário menor, com timeout ampliado.")
          PY

      - name: Garantir google-services.json do projeto
        run: |
          if [ ! -f google-services.json ]; then
            echo "google-services.json não está no repositório; criando a partir do workflow."
            cat > google-services.json <<'LOVEMIX_JSON'
          {
            "project_info": {
              "project_number": "985069046748",
              "project_id": "lovemix-73849",
              "storage_bucket": "lovemix-73849.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:985069046748:android:2b92a5982fa7147bd55d19",
                  "android_client_info": {
                    "package_name": "com.example.lovemix"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "985069046748-nhe1a14cv9ofts0a97q335o18vonanbb.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.example.lovemix",
                      "certificate_hash": "4252dc943e4fab1785326a42ee6ba4fa13c6386e"
                    }
                  },
                  {
                    "client_id": "985069046748-eb17v8ri34e4c9l5kevua27kt0ibgj50.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAkPpjNO5CWBy8h0yoppXQBvye7Awr6R2Q"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "985069046748-eb17v8ri34e4c9l5kevua27kt0ibgj50.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          LOVEMIX_JSON
          else
            echo "Usando google-services.json do repositório."
          fi

      - name: Configurar Firebase Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Usando GOOGLE_SERVICES_JSON do GitHub Secrets."
            has_web() { python3 -c "import json,sys; c=json.load(open(sys.argv[1])); sys.exit(0 if any(str(o.get('client_type'))=='3' for cl in c['client'] for o in cl.get('oauth_client',[])) else 1)" "$1" 2>/dev/null; }
            if has_web android/app/google-services.json; then echo "Secret: tem cliente WEB (ok)."; else echo "Secret: SEM cliente WEB."; fi
            if [ -f google-services.json ]; then
              if has_web google-services.json; then echo "Repositório: google-services.json existe e tem cliente WEB."; else echo "Repositório: google-services.json existe, mas SEM cliente WEB (arquivo antigo)."; fi
            else
              echo "Repositório: google-services.json NÃO existe na raiz do projeto."
            fi
            if ! has_web android/app/google-services.json && [ -f google-services.json ] && has_web google-services.json; then
              cp google-services.json android/app/google-services.json
              echo "::warning::O secret GOOGLE_SERVICES_JSON não tem cliente OAuth WEB (client_type 3). Usando o google-services.json do repositório. Atualize ou apague o secret."
            fi
          elif [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "Usando google-services.json incluído no projeto."
          elif [ -f lovemix_work/google-services.json ]; then
            cp lovemix_work/google-services.json android/app/google-services.json
            echo "Usando google-services.json incluído em lovemix_work/."
          else
            echo "ERRO: google-services.json não encontrado; adicione o arquivo ou configure GOOGLE_SERVICES_JSON."
            exit 1
          fi
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          package_name = config["client"][0]["client_info"]["android_client_info"]["package_name"]
          if package_name != "com.example.lovemix":
              raise SystemExit(
                  f"Pacote no google-services.json ({package_name}) diferente do esperado (com.example.lovemix)."
              )
          oauth_clients = config["client"][0].get("oauth_client", [])
          has_web_client = any(str(client.get("client_type")) == "3" for client in oauth_clients)
          if not has_web_client:
              raise SystemExit(
                  "O google-services.json do secret GOOGLE_SERVICES_JSON não contém cliente OAuth WEB (client_type 3). "
                  "Baixe novamente o arquivo no Firebase depois de cadastrar SHA-1/SHA-256 e atualizar a configuração Google."
              )
          web_client = next(
              str(client.get("client_id", ""))
              for client in oauth_clients
              if str(client.get("client_type")) == "3"
          )
          if not web_client.endswith(".apps.googleusercontent.com"):
              raise SystemExit("O cliente OAuth WEB do google-services.json está inválido.")
          with open("/tmp/lovemix-google-client.env", "w") as env_file:
              env_file.write(f"GOOGLE_SERVER_CLIENT_ID={web_client}\n")
          with open(__import__("os").environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"GOOGLE_SERVER_CLIENT_ID={web_client}\n")
          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          if settings.exists():
              s = settings.read_text()
              marker = 'id("com.google.gms.google-services") version "4.4.2" apply false'
              if marker not in s:
                  s = s.replace('plugins {', 'plugins {\n    ' + marker, 1)
                  settings.write_text(s)
          if app.exists():
              s = app.read_text()
              s = re.sub(r'namespace = "[^"]+"', f'namespace = "{package_name}"', s, count=1)
              s = re.sub(r'applicationId = "[^"]+"', f'applicationId = "{package_name}"', s, count=1)
              marker = 'id("com.google.gms.google-services")'
              if marker not in s:
                  s = s.replace('plugins {', 'plugins {\n    ' + marker, 1)
              app.write_text(s)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              s = manifest.read_text()
              permission = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)
              manifest.write_text(s)
          print(f"Package Android configurado para o Firebase: {package_name}")
          PY


      - name: Ativar core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Não encontrei android/app/build.gradle.kts")
          s = gradle.read_text()
          m = re.search(r'compileOptions\s*\{', s)
          if not m:
              raise SystemExit("Bloco compileOptions não encontrado no Gradle Android.")
          start = m.end()
          if "isCoreLibraryDesugaringEnabled" not in s:
              s = s[:start] + '\n        isCoreLibraryDesugaringEnabled = true' + s[start:]
          if "desugar_jdk_libs" not in s:
              dep = re.search(r'dependencies\s*\{', s)
              if dep:
                  pos = dep.end()
                  s = s[:pos] + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' + s[pos:]
              else:
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          gradle.write_text(s)
          print("Core library desugaring ativado.")
          PY

      - name: Configurar assinatura fixa do APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "AVISO: secrets ANDROID_* de assinatura não configurados."
            echo "O APK será compilado com a chave debug padrão do Android para permitir testar o aplicativo."
            echo "ATENÇÃO: login Google em APK de teste pode exigir cadastrar o SHA-1 da chave debug no Firebase. Para distribuição, configure uma chave release persistente."
            exit 0
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/lovemix-release.jks
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          s = gradle.read_text()
          if 'create("release")' not in s:
              signing = '''signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
              s = re.sub(r'buildTypes\s*\{', signing + 'buildTypes {', s, count=1)
          s, count = re.subn(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', 'signingConfig = signingConfigs.getByName("release")', s, count=1)
          if count == 0:
              s = re.sub(r'release\s*\{', 'release {\n            signingConfig = signingConfigs.getByName("release")', s, count=1)
          gradle.write_text(s)
          print("Assinatura release persistente configurada.")
          PYCODE
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/keystore/lovemix-release.jks" >> "$GITHUB_ENV"

      - name: Mostrar SHA-1 e SHA-256 da chave de assinatura (antes do build)
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="android/keystore/lovemix-release.jks"
          if [ ! -f "$KS" ]; then
            echo "Sem chave release (secrets ANDROID_* ausentes)."
            echo "O SHA da chave debug aparece no fim do build e muda a cada execução."
            exit 0
          fi
          OUT="$(keytool -list -v -keystore "$KS" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD")"
          SHA1="$(echo "$OUT" | grep -m1 'SHA1:' | awk '{print $2}')"
          SHA256="$(echo "$OUT" | grep -m1 'SHA256:' | awk '{print $2}')"
          [ -n "$SHA1" ] && [ -n "$SHA256" ] || { echo "ERRO: não consegui ler os SHA da keystore."; exit 1; }
          echo "SHA-1:   $SHA1"
          echo "SHA-256: $SHA256"
          {
            echo "## SHA da chave release (para o Firebase)"
            echo ""
            echo "**SHA-1**"
            echo '```'
            echo "$SHA1"
            echo '```'
            echo "**SHA-256**"
            echo '```'
            echo "$SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=SHA-1 (release)::$SHA1"
          echo "::notice title=SHA-256 (release)::$SHA256"

      - name: Instalar dependências
        run: flutter pub get


      - name: Corrigir Gradle legado dos plugins Zego (jcenter e ZIM)
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import json, re

          # Localiza os plugins pelo package_config.json (funciona em qualquer
          # PUB_CACHE), em vez de assumir ~/.pub-cache.
          cfg = Path(".dart_tool/package_config.json")
          if not cfg.exists():
              raise SystemExit("ERRO: .dart_tool/package_config.json não encontrado (flutter pub get falhou?).")
          data = json.loads(cfg.read_text())

          def pkg_dir(pkg):
              uri = pkg["rootUri"]
              if uri.startswith("file://"):
                  return Path(unquote(urlparse(uri).path))
              return (cfg.parent / unquote(uri)).resolve()

          zego = [p for p in data["packages"] if p["name"].startswith("zego")]
          print("Pacotes Zego encontrados:", ", ".join(sorted(p["name"] for p in zego)) or "nenhum")

          def ensure_android_plugin(content):
              plugins_match = re.search(r"(?m)^\s*plugins\s*\{", content)
              if plugins_match:
                  block_start = plugins_match.end()
                  block_end = content.find("}", block_start)
                  if block_end == -1:
                      return content
                  if not re.search(r"com\.android\.library", content[block_start:block_end]):
                      content = content[:block_start] + "\n    id 'com.android.library'" + content[block_start:]
                  return content
              if re.search(r"(?m)^\s*apply\s+plugin\s*:\s*['\"]com\.android\.(?:library|application)['\"]", content):
                  return content
              kotlin_apply = re.search(
                  r"(?m)^\s*apply\s+plugin\s*:\s*['\"](?:kotlin-android|org\.jetbrains\.kotlin\.android)['\"]",
                  content,
              )
              line = "apply plugin: 'com.android.library'\n"
              if kotlin_apply:
                  return content[:kotlin_apply.start()] + line + content[kotlin_apply.start():]
              return line + content

          for pkg in zego:
              root = pkg_dir(pkg) / "android"
              for name in ("build.gradle", "build.gradle.kts"):
                  gradle = root / name
                  if not gradle.exists():
                      continue
                  content = gradle.read_text()
                  original = content
                  content = re.sub(r"\bjcenter\s*\(\s*\)", "mavenCentral()", content)
                  if pkg["name"] == "zego_zim" and name == "build.gradle":
                      content = ensure_android_plugin(content)
                  if content != original:
                      gradle.write_text(content)
                      print(f"Corrigido: {gradle}")
                  else:
                      print(f"Já compatível: {gradle}")

          if not any(p["name"] == "zego_zim" for p in zego):
              print("AVISO: zego_zim não está nas dependências; nada a corrigir no ZIM.")
          print("Correção dos plugins Zego concluída.")
          PYCODE

      - name: Preparar ícone roxo e preto do LoveMix
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil, zlib, struct

          icon = Path("assets/icon/lovemix.png")
          launcher = Path("assets/lovemix_launcher.png")
          couple = Path("assets/lovemix_couple.jpg")
          for d in (icon.parent, launcher.parent):
              d.mkdir(parents=True, exist_ok=True)

          def first(paths):
              for c in paths:
                  q = Path(c)
                  if q.exists() and q.stat().st_size > 0:
                      return q
              return None

          def write_png(path, size, bg, fg):
              # Coração roxo gerado em Python puro (só usado se a arte original não existir).
              raw = bytearray()
              for y in range(size):
                  raw.append(0)
                  ny = -((y / size - 0.5) * 2.6) + 0.15
                  for x in range(size):
                      nx = (x / size - 0.5) * 2.6
                      v = (nx * nx + ny * ny - 1) ** 3 - nx * nx * ny ** 3
                      raw += bytes(fg if v <= 0 else bg)
              def chunk(t, d):
                  c = struct.pack(">I", len(d)) + t + d
                  return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
              png += chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")
              path.write_bytes(png)

          src = first([icon, launcher, "lovemix.png", "lovemix_launcher.png",
                       "icon/lovemix.png", "assets/lovemix.png", "assets/icon.png", "icon.png"])
          if src is not None:
              if not (icon.exists() and icon.stat().st_size > 0):
                  shutil.copyfile(src, icon)
              if not (launcher.exists() and launcher.stat().st_size > 0):
                  shutil.copyfile(src, launcher)
              print(f"Ícone original do LoveMix usado a partir de: {src}")
          else:
              write_png(icon, 512, (9, 0, 15, 255), (190, 60, 220, 255))
              write_png(launcher, 512, (0, 0, 0, 0), (190, 60, 220, 255))
              print("::warning::A arte do ícone (assets/icon/lovemix.png) NÃO está no repositório. "
                    "Usei um coração roxo e preto provisório. Envie lovemix.png para ter o ícone original.")

          if not (couple.exists() and couple.stat().st_size > 0):
              alt = first(["lovemix_couple.jpg", "assets/lovemix_couple.png", "lovemix_couple.png"])
              if alt is not None:
                  shutil.copyfile(alt, couple)
                  print(f"Imagem do casal copiada de: {alt}")
              else:
                  write_png(couple, 256, (9, 0, 15, 255), (150, 40, 190, 255))
                  print("::warning::assets/lovemix_couple.jpg NÃO está no repositório. Usei uma imagem provisória na tela de login.")

          for f in (icon, launcher, couple):
              assert f.exists() and f.stat().st_size > 0, f
          print("Ícone e imagens prontos.")
          PYCODE

      - name: Gerar e validar ícones nativos do LoveMix
        run: |
          # Gera os recursos Android a partir de assets/lovemix_launcher.png.
          dart run flutter_launcher_icons:main -f pubspec.yaml

          # Garante que o Android use o ícone gerado, e não o ícone padrão do Flutter.
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("ERRO: AndroidManifest.xml não foi criado.")

          content = manifest.read_text()
          if 'android:icon=' not in content:
              content = content.replace(
                  '<application',
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )
          else:
              content = re.sub(
                  r'android:icon="[^"]+"',
                  'android:icon="@mipmap/ic_launcher"',
                  content,
                  count=1
              )
          manifest.write_text(content)

          resources = Path("android/app/src/main/res")
          required = [
              resources / "mipmap-mdpi" / "ic_launcher.png",
              resources / "mipmap-hdpi" / "ic_launcher.png",
              resources / "mipmap-xhdpi" / "ic_launcher.png",
              resources / "mipmap-xxhdpi" / "ic_launcher.png",
              resources / "mipmap-xxxhdpi" / "ic_launcher.png",
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit("ERRO: ícones Android ausentes: " + ", ".join(missing))
          print("Ícone LoveMix gerado e validado em todas as densidades Android.")
          print('Manifesto configurado com android:icon="@mipmap/ic_launcher".')
          PY

      - name: Verificar código Dart
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 && ok=1 || ok=0
          echo "$(grep -c -E '^\s*error •' analyze.log || true) erro(s) de código encontrados."
          if [ "$ok" -ne 1 ]; then
            echo "=============== ERROS (só os que impedem o build) ==============="
            grep -E '^\s*error •' analyze.log || tail -30 analyze.log
            echo "================================================================="
            exit 1
          fi
          tail -3 analyze.log

      - name: Compilar APK release
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/lovemix-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            echo "Tentativa $attempt de 3 para gerar o APK..."
            if flutter build apk --release --no-shrink --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "A compilação falhou. Aguardando 20 segundos antes de tentar novamente..."
              sleep 20
            fi
          done
          echo "ERRO: não foi possível gerar o APK após 3 tentativas."
          exit 1

      - name: Verificar assinatura do APK
        continue-on-error: true
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK" || { echo "ERRO: APK não encontrado."; exit 1; }
          APKSIGNER="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Usando $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Mostrar SHA-1 e SHA-256 do APK
        continue-on-error: true
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"

          # Formata como o Firebase espera: AA:BB:CC:...
          fmt() { echo "$1" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//'; }

          SHA1_RAW="$(echo "$CERTS" | grep -m1 'certificate SHA-1 digest' | awk '{print $NF}')"
          SHA256_RAW="$(echo "$CERTS" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
          [ -n "$SHA1_RAW" ] && [ -n "$SHA256_RAW" ] || { echo "ERRO: não consegui ler os SHA."; echo "$CERTS"; exit 1; }
          SHA1="$(fmt "$SHA1_RAW")"
          SHA256="$(fmt "$SHA256_RAW")"

          {
            echo "SHA-1:   $SHA1"
            echo "SHA-256: $SHA256"
          } | tee build/sha-firebase.txt

          {
            echo "## Impressões digitais do certificado (para o Firebase)"
            echo ""
            echo "**SHA-1**"
            echo '```'
            echo "$SHA1"
            echo '```'
            echo "**SHA-256**"
            echo '```'
            echo "$SHA256"
            echo '```'
            echo "Firebase Console > Configurações do projeto > Seus apps > Android > Adicionar impressão digital."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=SHA-1::$SHA1"
          echo "::notice title=SHA-256::$SHA256"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: lovemix-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/sha-firebase.txt
