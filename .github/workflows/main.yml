name: LoveMix - Compilar APK

# Coloque este arquivo em: .github/workflows/compilar-apk.yml
# Funciona com o projeto na raiz do repositório OU dentro de um .zip enviado.
# Não exige nenhum secret: sem keystore, o APK sai assinado com a chave debug
# (instala normalmente no celular). Com os 4 secrets ANDROID_*, usa sua chave fixa.

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/compilar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovemix-compilar-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.3.1'      # exigido pelo plugin do Android 9.1.1
  ANDROID_PLATFORM: '37'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  apk:
    name: Compilar APK release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Localizar o projeto LoveMix
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml && -f lib/main.dart ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Não achei pubspec.yaml na raiz nem um .zip. Envie o projeto (ou o ZIP) ao repositório."
              exit 1
            fi
            echo "Usando ZIP: $ZIP_FILE"
            mkdir -p "$GITHUB_WORKSPACE/extracted"
            unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted" -x '__MACOSX/*'
            PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' -not -path '*/build/*' -not -path '*/__MACOSX/*' | head -n 1)"
            [[ -n "$PUBSPEC" ]] || { echo "::error::pubspec.yaml não encontrado dentro do ZIP."; exit 1; }
            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -d "$PROJECT_DIR/android"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT_DIR"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Instalar Flutter (estável)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::warning::sdkmanager não encontrado; o Gradle baixará o que faltar."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" \
            || echo "::warning::Não deu para pré-instalar o SDK; o Gradle vai baixar sozinho."

      # O gradlew do projeto não tem o gradle-wrapper.jar: usa o Gradle instalado acima.
      - name: Configurar Gradle do projeto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"
          {
            echo "distributionBase=GRADLE_USER_HOME"
            echo "distributionPath=wrapper/dists"
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            echo "networkTimeout=120000"
            echo "validateDistributionUrl=true"
            echo "zipStoreBase=GRADLE_USER_HOME"
            echo "zipStorePath=wrapper/dists"
          } > "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec gradle "$@"\n' > "$PROJECT_DIR/android/gradlew"
          chmod 755 "$PROJECT_DIR/android/gradlew"
          gradle --version | tee /tmp/gradle-version.txt
          grep -q "Gradle ${GRADLE_VERSION}" /tmp/gradle-version.txt

      # Com os 4 secrets: assina com a sua chave. Sem eles: assina com a chave debug.
      - name: Assinatura do APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${STORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            mkdir -p "$RUNNER_TEMP/signing"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
            test -s "$RUNNER_TEMP/signing/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Assinando com a chave fixa do repositório."
          else
            echo "::notice::Secrets de assinatura ausentes: usando a chave debug (APK instalável, não serve para a Play Store)."
            python3 - "$PROJECT_DIR/android/app/build.gradle" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          if "signingConfigs.debug" not in text:
              text = re.sub(r"(buildTypes\s*\{\s*release\s*\{)",
                            r"\1\n            signingConfig signingConfigs.debug", text, count=1)
              open(path, "w", encoding="utf-8").write(text)
              print("release passou a usar signingConfigs.debug")
          PY
          fi

      - name: Baixar dependências (flutter pub get)
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # settings.gradle exige flutter.sdk no local.properties.
      - name: Gerar android/local.properties
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          {
            echo "flutter.sdk=$FLUTTER_SDK"
            echo "sdk.dir=$ANDROID_HOME"
          } > android/local.properties

      # Plugins antigos do ZEGO ainda usam jcenter(), que foi desligado.
      - name: Corrigir jcenter() nos plugins ZEGO
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          cache = Path.home() / ".pub-cache/hosted/pub.dev"
          fixed = 0
          for android_dir in cache.glob("zego_*/android"):
              for f in list(android_dir.glob("*.gradle")) + list(android_dir.glob("*.gradle.kts")):
                  text = f.read_text()
                  new = re.sub(r"\bjcenter\s*\(\s*\)", "mavenCentral()", text)
                  if new != text:
                      f.write_text(new)
                      fixed += 1
          print(f"Arquivos ZEGO ajustados: {fixed}")
          PY

      # Só informativo: mostra erros de código sem impedir o build.
      - name: Analisar o código Dart
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          {
            echo "### Erros do flutter analyze"
            echo '```'
            grep -E "^\s*error •" /tmp/analyze.txt | head -n 50 || echo "Nenhum erro."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar o APK release
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if flutter build apk --release; then break; fi
            if [[ "$attempt" == "2" ]]; then
              echo "::error::A compilação falhou. Procure por 'error:' ou 'FAILURE' no log acima."
              exit 1
            fi
            echo "::warning::Tentativa $attempt falhou (pode ser rede); tentando de novo."
            sleep 10
          done
          APK="build/app/outputs/flutter-apk/app-release.apk"
          [[ -s "$APK" ]] || APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          [[ -n "${APK:-}" && -s "$APK" ]] || { echo "::error::O APK não foi gerado."; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"
          echo "Tamanho: $(du -h "$GITHUB_WORKSPACE/dist/LoveMix-release.apk" | awk '{print $1}')"

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: dist/LoveMix-release.apk
          if-no-files-found: error
          retention-days: 30
