name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip curl

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <( find . -maxdepth 1 -type f -iname '*.zip' | sort )
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Deixe somente um ZIP na raiz do repositorio."
            exit 1
          fi
          unzip -t "${ZIPS[0]}"
          mkdir -p extracted
          unzip -q "${ZIPS[0]}" -d extracted

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"
            if [ -s "$DIR/lib/main.dart" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <( find extracted -type f -name pubspec.yaml -print0 )
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Flutter nao encontrado."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT_DIR"

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          for FILE in \
            pubspec.yaml \
            lib/main.dart \
            android/settings.gradle \
            android/app/src/main/AndroidManifest.xml
          do
            if [ ! -s "$FILE" ]; then
              echo "::error::Arquivo ausente: $FILE"
              exit 1
            fi
          done
          echo "Arquivos principais encontrados."

      - name: Gerar Gradle Wrapper automaticamente
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$PROJECT_DIR/android"
          WRAPPER_DIR="$TARGET/gradle/wrapper"
          TEMP_DIR="$RUNNER_TEMP/lovemix-wrapper"
          DOWNLOAD_DIR="$RUNNER_TEMP/lovemix-gradle"
          mkdir -p "$WRAPPER_DIR" "$TEMP_DIR" "$DOWNLOAD_DIR"
          PROPERTIES="$WRAPPER_DIR/gradle-wrapper.properties"
          VERSION="8.14.3"
          if [ -s "$PROPERTIES" ]; then
            URL="$(sed -n 's/^distributionUrl=//p' "$PROPERTIES" | sed 's/\\:/:/g' | head -n 1)"
            FOUND_VERSION="$( printf '\%s\n' "$URL" | sed -nE 's/.*gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-(bin|all)\.zip.*/\1/p' )"
            if [ -n "$FOUND_VERSION" ]; then
              VERSION="$FOUND_VERSION"
            fi
          fi
          echo "Versao Gradle selecionada: $VERSION"
          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \ -o "$
