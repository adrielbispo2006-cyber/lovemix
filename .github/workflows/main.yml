
name: Gerar APK LoveMix

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip curl jq file python3

          yes | sdkmanager --licenses

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Localizar projeto LoveMix
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          if [[ -f "$GITHUB_WORKSPACE/pubspec.yaml" && -f "$GITHUB_WORKSPACE/lib/main.dart" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo '::error::Nenhum ZIP encontrado.'
              exit 1
            fi

            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

            PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' | head -n 1)"

            if [[ -z "$PUBSPEC" ]]; then
              echo '::error::pubspec.yaml não encontrado.'
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"

          test -f "$PROJECT_DIR/android/app/build.gradle" || \
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"

          test -f "$PROJECT_DIR/android/settings.gradle" || \
          test -f "$PROJECT_DIR/android/settings.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado: $PROJECT_DIR"

      - name: Instalar Gradle oficial 9.3.1
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            --output /tmp/gradle-9.3.1.zip

          unzip -q -o /tmp/gradle-9.3.1.zip -d /tmp

          GRADLE_BIN="/tmp/gradle-9.3.1/bin/gradle"

          test -x "$GRADLE_BIN"

          "$GRADLE_BIN" --version

          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"

          cat > "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties" <<'PROPERTIES'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=120000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPERTIES

          cat > "$PROJECT_DIR/android/gradlew" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec /tmp/gradle-9.3.1/bin/gradle "$@"
          SCRIPT

          chmod 755 "$PROJECT_DIR/android/gradlew"

      - name: Corrigir compileSdk para Android 35
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(__import__('os').environ['PROJECT_DIR'])
          android = root / 'android' / 'app'

          candidates = [
              android / 'build.gradle',
              android / 'build.gradle.kts'
          ]

          gradle_file = next(
              (p for p in candidates if p.is_file()),
              None
          )

          if gradle_file is None:
              print('::error::Arquivo build.gradle não encontrado.')
              sys.exit(1)

          content = gradle_file.read_text()

          if gradle_file.name.endswith('.kts'):
              replacement = 'compileSdk = 35'
          else:
              replacement = 'compileSdk 35'

          patterns = [
              r'(?m)^(\s*)compileSdkVersion\s+.*$',
              r'(?m)^(\s*)compileSdk\s*=\s*.*$',
              r'(?m)^(\s*)compileSdk\s+.*$'
          ]

          changed = False

          for pattern in patterns:
              if re.search(pattern, content):
                  content = re.sub(
                      pattern,
                      lambda m: m.group(1) + replacement,
                      content,
                      count=1
                  )
                  changed = True
                  break

          if not changed:
              match = re.search(r'(?m)^(\s*)android\s*\{', content)

              if not match:
                  print('::error::Bloco android não encontrado.')
                  sys.exit(1)

              indent = match.group(1) + '    '

              content = (
                  content[:match.end()] +
                  '\n' + indent + replacement +
                  content[match.end():]
              )

          gradle_file.write_text(content)

          print('compileSdk configurado para Android 35.')
          print(gradle_file)
          PY

          grep -n 'compileSdk' "$PROJECT_DIR/android/app/build.gradle" 2>/dev/null || \
          grep -n 'compileSdk' "$PROJECT_DIR/android/app/build.gradle.kts"

      - name: Validar configurações Android
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"

          SETTINGS="$ANDROID_DIR/settings.gradle"

          if [[ ! -f "$SETTINGS" ]]; then
            SETTINGS="$ANDROID_DIR/settings.gradle.kts"
          fi

          grep -q 'com.android.application' "$SETTINGS" || {
            echo '::error::Plugin Android não encontrado.'
            exit 1
          }

          grep -q 'org.jetbrains.kotlin.android' "$SETTINGS" || {
            echo '::error::Plugin Kotlin não encontrado.'
            exit 1
          }

          grep -Fq 'gradle-9.3.1-bin.zip' \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"

          echo 'Configuração Android validada.'

      - name: Preparar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: lovemix-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.yaml') }}
          restore-keys: |
            lovemix-gradle-${{ runner.os }}-

      - name: Configurar assinatura persistente (opcional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo 'Keystore não configurado; usando assinatura do projeto.'
            exit 0
          fi

          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Configure todos os secrets ANDROID_*.'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/lovemix-signing"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/lovemix-signing/release.jks"

          test -s "$RUNNER_TEMP/lovemix-signing/release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lovemix-signing/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Baixar dependências Flutter
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter pub get

      - name: Corrigir repositórios e ordem dos plugins ZEGO
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'

          for android_dir in cache.glob('zego_*/android'):
              for gradle_file in (
                  list(android_dir.glob('*.gradle')) +
                  list(android_dir.glob('*.gradle.kts'))
              ):
                  original = gradle_file.read_text()

                  content = re.sub(
                      r'\bjcenter\s*\(\s*\)',
                      'mavenCentral()',
                      original
                  )

                  lines = content.splitlines()

                  android_pattern = re.compile(
                      r'''^\s*apply\s+plugin\s*:\s*['"]com\.android\.(?:library|application)['"]'''
                  )

                  kotlin_pattern = re.compile(
                      r'''^\s*apply\s+plugin\s*:\s*['"](?:kotlin-android|org\.jetbrains\.kotlin\.android)['"]'''
                  )

                  android_positions = [
                      i for i, line in enumerate(lines)
                      if android_pattern.search(line)
                  ]

                  kotlin_positions = [
                      i for i, line in enumerate(lines)
                      if kotlin_pattern.search(line)
                  ]

                  if android_positions and kotlin_positions:
                      if min(android_positions) > min(kotlin_positions):
                          android_line = lines[min(android_positions)]
                          kotlin_line = lines[min(kotlin_positions)]

                          remove = set(android_positions + kotlin_positions)
                          first = min(remove)

                          lines = [
                              line for i, line in enumerate(lines)
                              if i not in remove
                          ]

                          lines[first:first] = [
                              android_line,
                              kotlin_line
                          ]

                          content = '\n'.join(lines) + '\n'

                  if content != original:
                      gradle_file.write_text(content)

          print('Correção ZEGO concluída.')
          PY

      - name: Validar ambiente Gradle 9.3.1
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          java -version
          flutter --version

          cd android

          ./gradlew --version | tee /tmp/lovemix-gradle.txt

          grep -q 'Gradle 9.3.1' /tmp/lovemix-gradle.txt

          echo 'Gradle 9.3.1 confirmado.'

      - name: Compilar APK Release
        id: build_apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo 'Verificando Android SDK 35...'

          sdkmanager --list_installed | grep 'platforms;android-35'

          echo 'Compilando LoveMix...'

          flutter build apk --release -v

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            APK="$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
              -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          fi

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo '::error::APK Release não foi gerado.'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$APK" "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          test -s "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          echo 'APK gerado com sucesso.'

      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          test -s "$APK"

          file "$APK"

          echo 'APK validado.'

      - name: Calcular SHA-1 SHA-256 e fingerprints
        id: hashes
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          FILE_SHA1="$(sha1sum "$APK" | awk '{print $1}')"
          FILE_SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          APKSIGNER="$(find "$SDK_DIR/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1 || true)"

          CERT_SHA1='Não disponível'
          CERT_SHA256='Não disponível'

          if [[ -n "$APKSIGNER" ]]; then
            CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"

            CERT_SHA1="$(printf '%s\n' "$CERT_INFO" |
              sed -n 's/.*certificate SHA-1 digest: *//p' | head -n 1)"

            CERT_SHA256="$(printf '%s\n' "$CERT_INFO" |
              sed -n 's/.*certificate SHA-256 digest: *//p' | head -n 1)"

            CERT_SHA1="${CERT_SHA1:-Não disponível}"
            CERT_SHA256="${CERT_SHA256:-Não disponível}"
          fi

          {
            echo "file_sha1=$FILE_SHA1"
            echo "file_sha256=$FILE_SHA256"
            echo "cert_sha1=$CERT_SHA1"
            echo "cert_sha256=$CERT_SHA256"
          } >> "$GITHUB_OUTPUT"

          {
            echo 'LoveMix - Verificação de integridade'
            echo
            echo 'APK: LoveMix-release.apk'
            echo
            echo 'SHA-1 do arquivo:'
            echo "$FILE_SHA1"
            echo
            echo 'SHA-256 do arquivo:'
            echo "$FILE_SHA256"
            echo
            echo 'SHA-1 do certificado Firebase/Google:'
            echo "$CERT_SHA1"
            echo
            echo 'SHA-256 do certificado Firebase/Google:'
            echo "$CERT_SHA256"
          } > "$GITHUB_WORKSPACE/dist/CHECKSUMS.txt"

          echo 'Hashes calculados.'

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: |
            dist/LoveMix-release.apk
            dist/CHECKSUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Preparar Release
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="lovemix-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=LoveMix ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Criar Release para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            # 💜 LoveMix

            APK Release compilado automaticamente.

            Android compileSdk 35.

            SHA-1 e SHA-256 do APK e do certificado estão em CHECKSUMS.txt.
          files: |
            dist/LoveMix-release.apk
            dist/CHECKSUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Mostrar download e SHA no Summary
        if: success()
        env:
          FILE_SHA1: ${{ steps.hashes.outputs.file_sha1 }}
          FILE_SHA256: ${{ steps.hashes.outputs.file_sha256 }}
          CERT_SHA1: ${{ steps.hashes.outputs.cert_sha1 }}
          CERT_SHA256: ${{ steps.hashes.outputs.cert_sha256 }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          {
            echo '# 💜 LoveMix'
            echo
            echo '## <span style="color:#a855f7">BUILD CONCLUÍDO</span>'
            echo
            echo "### 📥 [BAIXAR APK LOVEMIX]($RELEASE_URL)"
            echo
            echo '### 🔐 SHA-1 do arquivo'
            echo '```text'
            echo "$FILE_SHA1"
            echo '```'
            echo
            echo '### 🔐 SHA-256 do arquivo'
            echo '```text'
            echo "$FILE_SHA256"
            echo '```'
            echo
            echo '### 📱 Certificado Firebase/Google'
            echo
            echo '**SHA-1:**'
            echo '```text'
            echo "$CERT_SHA1"
            echo '```'
            echo
            echo '**SHA-256:**'
            echo '```text'
            echo "$CERT_SHA256"
            echo '```'
            echo
            echo '### 📦 Arquivos publicados'
            echo '- LoveMix-release.apk'
            echo '- CHECKSUMS.txt'
          } >> "$GITHUB_STEP_SUMMARY"
