name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar o projeto Flutter no repositório
        run: |
          if [ -f pubspec.yaml ] && [ -f lib/main.dart ]; then
            echo "Projeto encontrado na raiz do repositório."
            exit 0
          fi

          # 1) Projeto dentro de uma subpasta (ex.: lovemix_work/)
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [ -f "$d/lib/main.dart" ]; then
              echo "Projeto encontrado na subpasta: $d (copiando para a raiz)"
              cp -a "$d"/. .
              exit 0
            fi
          done < <(find . -maxdepth 4 -name pubspec.yaml -not -path './.git/*' -not -path '*/node_modules/*' | sort)

          # 2) Zip do projeto enviado como arquivo para o repositório
          while IFS= read -r z; do
            if unzip -l "$z" 2>/dev/null | grep -q 'pubspec.yaml'; then
              rm -rf /tmp/proj_zip && mkdir -p /tmp/proj_zip
              unzip -q "$z" -d /tmp/proj_zip || continue
              while IFS= read -r f; do
                d="$(dirname "$f")"
                if [ -f "$d/lib/main.dart" ]; then
                  echo "Projeto encontrado dentro do zip: $z (extraindo para a raiz)"
                  cp -a "$d"/. .
                  exit 0
                fi
              done < <(find /tmp/proj_zip -maxdepth 3 -name pubspec.yaml | sort)
            fi
          done < <(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | sort -r)

          echo "::error::Não encontrei o projeto Flutter (pubspec.yaml + lib/main.dart) em nenhum lugar do repositório."
          echo "Conteúdo do repositório:"
          find . -maxdepth 2 -not -path './.git/*' -not -path './.git' | sort | head -60
          exit 1

      - name: Conferir arquivos do projeto no repositório
        run: |
          missing=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ ! -s "$f" ]; then
              echo "FALTANDO no repositório: $f"
              missing=1
            fi
          done <<'LISTA'
          pubspec.yaml
          lib/main.dart
          lib/app.dart
          lib/firebase_options.dart
          lib/screens/admin_screen.dart
          lib/screens/alliance_wall_screen.dart
          lib/screens/auth_screen.dart
          lib/screens/chat_rooms_screen.dart
          lib/screens/chat_screen.dart
          lib/screens/discover_screen.dart
          lib/screens/home_screen.dart
          lib/screens/messages_screen.dart
          lib/screens/post_interactions_screen.dart
          lib/screens/profile_frames_screen.dart
          lib/screens/profile_screen.dart
          lib/screens/profile_view_screen.dart
          lib/screens/ranking_screen.dart
          lib/screens/resources_screen.dart
          lib/screens/stories_widget.dart
          lib/screens/wallet_screen.dart
          lib/screens/zego_live_screen.dart
          lib/services/data_service.dart
          lib/services/notification_service.dart
          lib/services/zego_config.dart
          lib/widgets/profile_frame.dart
          LISTA
          if [ "$missing" -ne 0 ]; then
            echo "::error::Faltam arquivos do projeto no GitHub (lista acima). Envie esses arquivos nas mesmas pastas do zip e rode de novo."
            exit 1
          fi
          echo "Todos os arquivos de código estão no repositório."
          for f in assets/icon/lovemix.png assets/lovemix_launcher.png assets/lovemix_couple.jpg; do
            [ -s "$f" ] && echo "OK: $f" || echo "::warning::Imagem ausente: $f (o workflow tenta achar ou criar uma substituta)."
          done

      - name: Aplicar código corrigido do ZEGO e das notificações
        run: |
          mkdir -p lib/screens lib/services

          cat > /tmp/novo_zego_live_screen.dart <<'LOVEMIX_ZEGO'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import '../services/data_service.dart';
          import '../services/zego_config.dart';
          import 'package:zego_uikit_prebuilt_live_audio_room/zego_uikit_prebuilt_live_audio_room.dart';
          import 'package:zego_uikit_prebuilt_live_streaming/zego_uikit_prebuilt_live_streaming.dart';
          import 'package:zego_uikit_signaling_plugin/zego_uikit_signaling_plugin.dart';

          class ZegoLiveHubScreen extends StatelessWidget {
            const ZegoLiveHubScreen({super.key, required this.mediaMode});
            final String mediaMode; // audio, video ou live

            String get _title => mediaMode == 'audio'
                ? 'Salas de Voz'
                : mediaMode == 'video' ? 'Salas de Vídeo' : 'Lives LoveMix';

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF080510),
                appBar: AppBar(
                  title: Text(_title),
                  actions: [
                    IconButton(
                      tooltip: 'Entrar com código',
                      icon: const Icon(Icons.key_rounded),
                      onPressed: () => _joinByCode(context),
                    ),
                  ],
                ),
                floatingActionButton: FloatingActionButton.extended(
                  backgroundColor: const Color(0xFFFF2DAB),
                  foregroundColor: Colors.white,
                  icon: const Icon(Icons.add),
                  label: Text(mediaMode == 'audio' ? 'Criar sala' : 'Começar transmissão'),
                  onPressed: () => _create(context),
                ),
                body: Column(children: [
                  Container(
                    margin: const EdgeInsets.all(16),
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      gradient: const LinearGradient(
                        colors: [Color(0xFF35104F), Color(0xFF170D25)],
                      ),
                      borderRadius: BorderRadius.circular(18),
                      border: Border.all(color: const Color(0xFF9B35FF)),
                    ),
                    child: Row(children: [
                      Icon(mediaMode == 'audio' ? Icons.mic : Icons.live_tv,
                          color: const Color(0xFFFF55D0), size: 34),
                      const SizedBox(width: 12),
                      Expanded(child: Text(
                        mediaMode == 'audio'
                            ? 'Entre no palco, peça para falar e converse ao vivo.'
                            : 'Crie uma transmissão ou entre em uma live da comunidade.',
                        style: const TextStyle(color: Colors.white, fontWeight: FontWeight.w600),
                      )),
                    ]),
                  ),
                  Expanded(
                    child: StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                      stream: DataService.instance.publicLiveRooms(mediaMode: mediaMode),
                      builder: (context, snap) {
                        if (snap.hasError) {
                          return const Center(child: Text('Erro ao carregar transmissões. Confira as regras e índices do Firestore.'));
                        }
                        if (!snap.hasData) {
                          return const Center(child: CircularProgressIndicator(color: Color(0xFFFF2DAB)));
                        }
                        final docs = snap.data!.docs;
                        if (docs.isEmpty) {
                          return Center(child: Padding(
                            padding: const EdgeInsets.all(28),
                            child: Column(mainAxisSize: MainAxisSize.min, children: [
                              const Icon(Icons.sensors, size: 54, color: Color(0xFFB65BDB)),
                              const SizedBox(height: 12),
                              const Text('Nenhuma transmissão agora',
                                style: TextStyle(fontWeight: FontWeight.bold, fontSize: 17)),
                              const SizedBox(height: 6),
                              const Text('Seja a primeira pessoa a criar uma sala!',
                                textAlign: TextAlign.center, style: TextStyle(color: Colors.white60)),
                            ]),
                          ));
                        }
                        return ListView.builder(
                          padding: const EdgeInsets.fromLTRB(14, 4, 14, 100),
                          itemCount: docs.length,
                          itemBuilder: (context, index) {
                            final doc = docs[index];
                            final data = doc.data();
                            final members = List<String>.from(data['members'] ?? []);
                            return Card(
                              color: const Color(0xFF1A1028),
                              shape: RoundedRectangleBorder(
                                borderRadius: BorderRadius.circular(16),
                                side: const BorderSide(color: Color(0xFF71349B)),
                              ),
                              child: ListTile(
                                contentPadding: const EdgeInsets.all(12),
                                leading: CircleAvatar(
                                  backgroundColor: const Color(0xFF7027A5),
                                  child: Icon(mediaMode == 'audio' ? Icons.mic : Icons.videocam,
                                    color: Colors.white),
                                ),
                                title: Text((data['name'] ?? 'Sala LoveMix').toString(),
                                  style: const TextStyle(fontWeight: FontWeight.bold)),
                                subtitle: Text('${members.length} participantes • AO VIVO',
                                  style: const TextStyle(color: Colors.white60)),
                                trailing: const Icon(Icons.play_circle_fill,
                                  color: Color(0xFFFF45C4), size: 30),
                                onTap: () async {
                                  try {
                                    if (!members.contains(DataService.instance.uid)) {
                                      await DataService.instance.joinRoom(doc.id);
                                    }
                                    if (!context.mounted) return;
                                    Navigator.push(context, MaterialPageRoute(
                                      builder: (_) => ZegoMediaSessionScreen(
                                        roomId: doc.id,
                                        roomName: (data['name'] ?? 'Sala LoveMix').toString(),
                                        mediaMode: mediaMode,
                                        isHost: data['ownerId'] == DataService.instance.uid,
                                      ),
                                    ));
                                  } catch (e) {
                                    if (context.mounted) {
                                      ScaffoldMessenger.of(context).showSnackBar(
                                        SnackBar(content: Text('Não foi possível entrar: $e')));
                                    }
                                  }
                                },
                              ),
                            );
                          },
                        );
                      },
                    ),
                  ),
                ]),
              );
            }

            Future<void> _joinByCode(BuildContext context) async {
              final controller = TextEditingController();
              final code = await showDialog<String>(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF21132F),
                  title: const Text('Entrar com código'),
                  content: TextField(
                    controller: controller,
                    decoration: const InputDecoration(labelText: 'Código da sala'),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancelar')),
                    ElevatedButton(
                      onPressed: () {
                        final value = controller.text.trim();
                        if (value.isNotEmpty) Navigator.pop(ctx, value);
                      },
                      child: const Text('Entrar'),
                    ),
                  ],
                ),
              );
              controller.dispose();
              if (code == null || !context.mounted) return;
              try {
                final room = await FirebaseFirestore.instance.collection('rooms').doc(code).get();
                final data = room.data();
                if (!room.exists || data == null || data['isLive'] != true ||
                    data['mediaMode'] != mediaMode) {
                  throw Exception('Código inválido ou transmissão encerrada.');
                }
                final members = List<String>.from(data['members'] ?? []);
                if (!members.contains(DataService.instance.uid)) {
                  await DataService.instance.joinRoom(code);
                }
                if (!context.mounted) return;
                Navigator.push(context, MaterialPageRoute(
                  builder: (_) => ZegoMediaSessionScreen(
                    roomId: code,
                    roomName: (data['name'] ?? 'Sala LoveMix').toString(),
                    mediaMode: mediaMode,
                    isHost: data['ownerId'] == DataService.instance.uid,
                  ),
                ));
              } catch (e) {
                if (context.mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text(e.toString().replaceFirst('Exception: ', ''))));
                }
              }
            }

            Future<void> _create(BuildContext context) async {
              final controller = TextEditingController();
              final name = await showDialog<String>(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF21132F),
                  title: Text(mediaMode == 'audio' ? 'Criar sala de voz' : 'Criar transmissão'),
                  content: TextField(
                    controller: controller,
                    maxLength: 40,
                    decoration: const InputDecoration(labelText: 'Nome da sala'),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancelar')),
                    ElevatedButton(
                      onPressed: () {
                        final value = controller.text.trim();
                        if (value.length >= 3) Navigator.pop(ctx, value);
                      },
                      child: const Text('Criar'),
                    ),
                  ],
                ),
              );
              controller.dispose();
              if (name == null || !context.mounted) return;
              try {
                final id = await DataService.instance.createRoom(
                  name,
                  category: mediaMode == 'audio' ? 'Salas de Voz' : 'Lives',
                  description: 'Transmissão ao vivo do LoveMix',
                  isLive: true,
                  mediaMode: mediaMode,
                );
                if (!context.mounted) return;
                await showDialog<void>(
                  context: context,
                  builder: (ctx) => AlertDialog(
                    backgroundColor: const Color(0xFF21132F),
                    title: const Text('Sua sala está pronta!'),
                    content: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                      const Text('Compartilhe este código para seus amigos entrarem:'),
                      const SizedBox(height: 12),
                      SelectableText(id, style: const TextStyle(
                        color: Color(0xFFFF70D0), fontWeight: FontWeight.bold, fontSize: 18)),
                      TextButton.icon(
                        onPressed: () {
                          Clipboard.setData(ClipboardData(text: id));
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(content: Text('Código copiado!')));
                        },
                        icon: const Icon(Icons.copy), label: const Text('Copiar código'),
                      ),
                    ]),
                    actions: [ElevatedButton(
                      onPressed: () => Navigator.pop(ctx), child: const Text('Continuar'))],
                  ),
                );
                if (!context.mounted) return;
                Navigator.push(context, MaterialPageRoute(
                  builder: (_) => ZegoMediaSessionScreen(
                    roomId: id, roomName: name, mediaMode: mediaMode, isHost: true,
                  ),
                ));
              } catch (e) {
                if (context.mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Erro ao criar sala: $e')));
                }
              }
            }
          }

          class ZegoMediaSessionScreen extends StatelessWidget {
            const ZegoMediaSessionScreen({
              super.key,
              required this.roomId,
              required this.roomName,
              required this.mediaMode,
              required this.isHost,
            });

            final String roomId;
            final String roomName;
            final String mediaMode;
            final bool isHost;

            String get _safeUserId {
              final raw = FirebaseAuth.instance.currentUser?.uid ?? 'guest';
              return raw.replaceAll(RegExp(r'[^a-zA-Z0-9_]'), '_');
            }

            String get _safeUserName {
              final user = FirebaseAuth.instance.currentUser;
              final raw = (user?.displayName?.trim().isNotEmpty == true)
                  ? user!.displayName!.trim()
                  : (user?.email?.split('@').first ?? 'LoveMix');
              final sanitized = raw.replaceAll(RegExp(r'[^a-zA-Z0-9_]'), '_');
              return sanitized.length > 32 ? sanitized.substring(0, 32) : sanitized;
            }

            @override
            Widget build(BuildContext context) {
              final media = mediaMode == 'audio'
                  ? SafeArea(child: ZegoUIKitPrebuiltLiveAudioRoom(
                      appID: ZegoConfig.appId,
                      appSign: ZegoConfig.appSign,
                      userID: _safeUserId,
                      userName: _safeUserName,
                      roomID: roomId,
                      config: (isHost
                          ? ZegoUIKitPrebuiltLiveAudioRoomConfig.host()
                          : ZegoUIKitPrebuiltLiveAudioRoomConfig.audience())
                        ..turnOnMicrophoneWhenJoining = false
                        ..topMenuBar.buttons = [
                          ZegoLiveAudioRoomMenuBarButtonName.minimizingButton,
                        ]
                        ..bottomMenuBar.showInRoomMessageButton = true
                        ..bottomMenuBar.maxCount = 5
                        ..bottomMenuBar.hostButtons = [
                          ZegoLiveAudioRoomMenuBarButtonName.toggleMicrophoneButton,
                          ZegoLiveAudioRoomMenuBarButtonName.showMemberListButton,
                          ZegoLiveAudioRoomMenuBarButtonName.closeSeatButton,
                        ]
                        ..bottomMenuBar.speakerButtons = [
                          ZegoLiveAudioRoomMenuBarButtonName.toggleMicrophoneButton,
                          ZegoLiveAudioRoomMenuBarButtonName.showMemberListButton,
                        ]
                        ..bottomMenuBar.audienceButtons = [
                          ZegoLiveAudioRoomMenuBarButtonName.applyToTakeSeatButton,
                          ZegoLiveAudioRoomMenuBarButtonName.showMemberListButton,
                        ]
                        ..bottomMenuBar.hostExtendButtons = [
                          StreamBuilder<DocumentSnapshot<Map<String, dynamic>>>(
                            stream: FirebaseFirestore.instance
                                .collection('rooms').doc(roomId).snapshots(),
                            builder: (context, snapshot) {
                              final locked = snapshot.data?.data()?['isLocked'] == true;
                              return SizedBox(
                                width: 42,
                                height: 42,
                                child: ElevatedButton(
                                  style: ElevatedButton.styleFrom(
                                    padding: EdgeInsets.zero,
                                    shape: const CircleBorder(),
                                    backgroundColor: const Color(0xFF35104F),
                                    foregroundColor: Colors.white,
                                  ),
                                  onPressed: snapshot.hasData ? () async {
                                    try {
                                      await FirebaseFirestore.instance
                                          .collection('rooms').doc(roomId)
                                          .update({'isLocked': !locked});
                                    } catch (error) {
                                      if (context.mounted) {
                                        ScaffoldMessenger.of(context).showSnackBar(
                                          SnackBar(content: Text('Não foi possível alterar o bloqueio: $error')),
                                        );
                                      }
                                    }
                                  } : null,
                                  child: Icon(locked ? Icons.lock_open : Icons.lock),
                                ),
                              );
                            },
                          ),
                        ],
                    ))
                  : SafeArea(child: ZegoUIKitPrebuiltLiveStreaming(
                      appID: ZegoConfig.appId,
                      appSign: ZegoConfig.appSign,
                      userID: _safeUserId,
                      userName: _safeUserName,
                      liveID: roomId,
                      config: isHost
                          ? ZegoUIKitPrebuiltLiveStreamingConfig.host(
                              plugins: [ZegoUIKitSignalingPlugin()],
                            )
                          : ZegoUIKitPrebuiltLiveStreamingConfig.audience(
                              plugins: [ZegoUIKitSignalingPlugin()],
                            ),
                    ));

              return Scaffold(
                backgroundColor: const Color(0xFF080510),
                body: Stack(children: [
                  Positioned.fill(child: media),
                  Positioned(
                    left: 14,
                    top: MediaQuery.of(context).padding.top + 56,
                    child: IgnorePointer(
                      child: StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                        stream: DataService.instance.roomMessages(roomId)
                            .where('type', isEqualTo: 'gift')
                            .orderBy('createdAt', descending: true)
                            .limit(1)
                            .snapshots(),
                        builder: (context, snap) {
                          if (!snap.hasData || snap.data!.docs.isEmpty) {
                            return const SizedBox.shrink();
                          }
                          final gift = snap.data!.docs.first.data();
                          final emoji = (gift['emoji'] ?? '🎁').toString();
                          final name = (gift['giftName'] ?? 'Presente').toString();
                          return Container(
                            padding: const EdgeInsets.symmetric(horizontal: 13, vertical: 9),
                            decoration: BoxDecoration(
                              color: const Color(0xDD28113D),
                              borderRadius: BorderRadius.circular(24),
                              border: Border.all(color: const Color(0xFFFFD76A)),
                            ),
                            child: Text('$emoji $name enviado!',
                              style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                          );
                        },
                      ),
                    ),
                  ),
                  Positioned(
                    top: MediaQuery.of(context).padding.top + 8,
                    right: 12,
                    child: Material(
                      color: Colors.black54,
                      shape: const CircleBorder(),
                      child: IconButton(
                        tooltip: 'Sair da transmissão',
                        icon: const Icon(Icons.close, color: Colors.white),
                        onPressed: () async {
                          if (isHost) {
                            try { await DataService.instance.endLiveRoom(roomId); } catch (_) {}
                          }
                          if (context.mounted) Navigator.pop(context);
                        },
                      ),
                    ),
                  ),
                  if (!isHost)
                    Positioned(
                      right: 14,
                      bottom: MediaQuery.of(context).padding.bottom + 110,
                      child: _GiftButton(roomId: roomId),
                    ),
                  if (mediaMode == 'audio')
                    Positioned(
                      left: 14,
                      bottom: MediaQuery.of(context).padding.bottom + 110,
                      child: _RoomInteractionButton(roomId: roomId),
                    ),
                  if (mediaMode == 'audio')
                    Positioned(
                      left: 0, right: 0,
                      top: MediaQuery.of(context).padding.top + 105,
                      child: _RoomInteractionOverlay(roomId: roomId),
                    ),
                ]),
              );
            }
          }


          class _RoomInteractionButton extends StatelessWidget {
            const _RoomInteractionButton({required this.roomId});
            final String roomId;

            static const actions = <Map<String, String>>[
              {'id':'hug','emoji':'🫂','name':'Abraço'},
              {'id':'kiss','emoji':'💋','name':'Beijinho'},
              {'id':'love','emoji':'💕','name':'Coração apaixonado'},
              {'id':'dance','emoji':'💃','name':'Dançar juntos'},
              {'id':'laugh','emoji':'😂','name':'Brincadeira'},
              {'id':'highfive','emoji':'🙌','name':'Toca aqui'},
              {'id':'fight','emoji':'🥊','name':'Lutinha divertida'},
              {'id':'party','emoji':'🎉','name':'Comemorar'},
            ];

            @override
            Widget build(BuildContext context) => FloatingActionButton.extended(
              heroTag: 'zego-room-interactions',
              backgroundColor: const Color(0xFF7027A5),
              foregroundColor: Colors.white,
              icon: const Icon(Icons.emoji_emotions),
              label: const Text('Interações'),
              onPressed: () async {
                final roomSnap = await FirebaseFirestore.instance.collection('rooms').doc(roomId).get();
                if (!context.mounted) return;
                final members = List<String>.from(roomSnap.data()?['members'] ?? [])
                    .where((id) => id != DataService.instance.uid).toList();
                if (members.isEmpty) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Espere outra pessoa entrar na sala para interagir.')));
                  return;
                }
                String target = members.first;
                Map<String, String> action = actions.first;
                await showModalBottomSheet<void>(
                  context: context, backgroundColor: const Color(0xFF1A1028),
                  isScrollControlled: true, shape: const RoundedRectangleBorder(
                    borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
                  builder: (sheetContext) => StatefulBuilder(builder: (ctx, setSheet) =>
                    Padding(padding: EdgeInsets.fromLTRB(18, 18, 18, 22 + MediaQuery.of(ctx).viewInsets.bottom),
                      child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                        const Center(child: Text('Interações da sala', style: TextStyle(color: Colors.white, fontSize: 19, fontWeight: FontWeight.bold))),
                        const SizedBox(height: 14),
                        const Text('Escolha com quem interagir', style: TextStyle(color: Colors.white70)),
                        const SizedBox(height: 6),
                        DropdownButtonFormField<String>(
                          value: target, dropdownColor: const Color(0xFF29143D),
                          decoration: const InputDecoration(labelText: 'Participante'),
                          items: members.map((id) => DropdownMenuItem(value: id, child: Text(id == DataService.instance.uid ? 'Você' : 'Participante ${id.substring(0, id.length > 6 ? 6 : id.length)}'))).toList(),
                          onChanged: (v) { if (v != null) setSheet(() => target = v); },
                        ),
                        const SizedBox(height: 14),
                        const Text('Escolha a interação', style: TextStyle(color: Colors.white70)),
                        const SizedBox(height: 8),
                        GridView.builder(shrinkWrap: true, physics: const NeverScrollableScrollPhysics(),
                          itemCount: actions.length, gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 4, mainAxisSpacing: 8, crossAxisSpacing: 8, childAspectRatio: .92),
                          itemBuilder: (_, i) { final item = actions[i]; final selected = action['id'] == item['id']; return InkWell(
                            onTap: () => setSheet(() => action = item),
                            borderRadius: BorderRadius.circular(14),
                            child: Container(decoration: BoxDecoration(color: selected ? const Color(0xFF63258D) : const Color(0xFF2A1A3A), borderRadius: BorderRadius.circular(14), border: Border.all(color: selected ? const Color(0xFFFF55D0) : Colors.white12)),
                              child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Text(item['emoji']!, style: const TextStyle(fontSize: 27)), const SizedBox(height: 3), Text(item['name']!, textAlign: TextAlign.center, maxLines: 2, style: const TextStyle(color: Colors.white, fontSize: 10))])));
                          },
                        ),
                        const SizedBox(height: 14),
                        SizedBox(width: double.infinity, child: ElevatedButton.icon(
