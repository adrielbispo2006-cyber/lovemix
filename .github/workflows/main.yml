name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: lovemix-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar o projeto Flutter no repositório
        run: |
          if [ -f pubspec.yaml ] && [ -f lib/main.dart ]; then
            echo "Projeto encontrado na raiz do repositório."
            exit 0
          fi

          # 1) Projeto dentro de uma subpasta (ex.: lovemix_work/)
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [ -f "$d/lib/main.dart" ]; then
              echo "Projeto encontrado na subpasta: $d (copiando para a raiz)"
              cp -a "$d"/. .
              exit 0
            fi
          done < <(find . -maxdepth 4 -name pubspec.yaml -not -path './.git/*' -not -path '*/node_modules/*' | sort)

          # 2) Zip do projeto enviado como arquivo para o repositório
          while IFS= read -r z; do
            if unzip -l "$z" 2>/dev/null | grep -q 'pubspec.yaml'; then
              rm -rf /tmp/proj_zip && mkdir -p /tmp/proj_zip
              unzip -q "$z" -d /tmp/proj_zip || continue
              while IFS= read -r f; do
                d="$(dirname "$f")"
                if [ -f "$d/lib/main.dart" ]; then
                  echo "Projeto encontrado dentro do zip: $z (extraindo para a raiz)"
                  cp -a "$d"/. .
                  exit 0
                fi
              done < <(find /tmp/proj_zip -maxdepth 3 -name pubspec.yaml | sort)
            fi
          done < <(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | sort -r)

          echo "::error::Não encontrei o projeto Flutter (pubspec.yaml + lib/main.dart) em nenhum lugar do repositório."
          echo "Conteúdo do repositório:"
          find . -maxdepth 2 -not -path './.git/*' -not -path './.git' | sort | head -60
          exit 1

      - name: Conferir arquivos do projeto no repositório
        run: |
          missing=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ ! -s "$f" ]; then
              echo "FALTANDO no repositório: $f"
              missing=1
            fi
          done <<'LISTA'
          pubspec.yaml
          lib/main.dart
          lib/app.dart
          lib/firebase_options.dart
          lib/screens/admin_screen.dart
          lib/screens/alliance_wall_screen.dart
          lib/screens/auth_screen.dart
          lib/screens/chat_rooms_screen.dart
          lib/screens/chat_screen.dart
          lib/screens/discover_screen.dart
          lib/screens/home_screen.dart
          lib/screens/messages_screen.dart
          lib/screens/post_interactions_screen.dart
          lib/screens/profile_frames_screen.dart
          lib/screens/profile_screen.dart
          lib/screens/profile_view_screen.dart
          lib/screens/ranking_screen.dart
          lib/screens/resources_screen.dart
          lib/screens/stories_widget.dart
          lib/screens/wallet_screen.dart
          lib/screens/zego_live_screen.dart
          lib/services/data_service.dart
          lib/services/notification_service.dart
          lib/services/zego_config.dart
          lib/widgets/profile_frame.dart
          LISTA

          if [ "$missing" -ne 0 ]; then
            echo "::error::Faltam arquivos do projeto no GitHub (lista acima). Envie esses arquivos nas mesmas pastas do zip e rode de novo."
            exit 1
          fi

          echo "Todos os arquivos de código estão no repositório."
          for f in assets/icon/lovemix.png assets/lovemix_launcher.png assets/lovemix_couple.jpg; do
            [ -s "$f" ] && echo "OK: $f" || echo "::warning::Imagem ausente: $f (o workflow tenta achar ou criar uma substituta)."
          done

      - name: Aplicar código corrigido do ZEGO e das notificações
        run: |
          python3 scripts/apply_patches.py

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Garantir versões compatíveis com ZEGO
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          p = Path("pubspec.yaml")
          if not p.exists():
              raise SystemExit("ERRO: pubspec.yaml não encontrado na raiz.")
          content = p.read_text()
          fixes = {
              "permission_handler": "^13.0.2",
              "cached_network_image": "^4.0.6",
              "zego_uikit_prebuilt_live_audio_room": "^3.16.12",
          }
          for name, version in fixes.items():
              content, count = re.subn(
                  r"(?m)^(\s*)" + name + r":\s*[^\n#]+",
                  lambda m: m.group(1) + name + ": " + version,
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("ERRO: " + name + " não encontrado no pubspec.yaml.")
              print(name + " fixado em " + version)
          p.write_text(content)
          PYCODE
          rm -f pubspec.lock
          grep -nE "permission_handler|cached_network_image|zego_uikit_prebuilt_live_audio_room" pubspec.yaml

      - name: Criar estrutura Android
        run: flutter create . --platforms=android

      - name: Configurar AGP 9.1.1, Gradle 9.3.1 e compatibilidade Kotlin
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          candidates = [Path("android/settings.gradle.kts"), Path("android/settings.gradle")]
          settings = next((p for p in candidates if p.exists()), None)
          if settings is None:
              raise SystemExit("ERRO: não encontrei android/settings.gradle(.kts).")
          content = settings.read_text()
          patterns = [
              (r'(id\("com\.android\.application"\)\s+version\s+")[^\"]+(\")', r'\g<1>9.1.1\g<2>'),
              (r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^\"]+(\")', r'\g<1>2.2.20\g<2>'),
              (r"(id\s+['\"]com\.android\.application['\"]\s+version\s+['\"])[^'\"]+(['\"])", r'\g<1>9.1.1\g<2>'),
              (r"(id\s+['\"]org\.jetbrains\.kotlin\.android['\"]\s+version\s+['\"])[^'\"]+(['\"])", r'\g<1>2.2.20\g<2>'),
          ]
          for pattern, repl in patterns:
              content = re.sub(pattern, repl, content)
          if not re.search(r'com\.android\.application.*version.*9\.1\.1', content, re.S):
              content = re.sub(r'plugins\s*\{', 'plugins {\n id("com.android.application") version "9.1.1" apply false', content, count=1)
          if not re.search(r'org\.jetbrains\.kotlin\.android.*version.*2\.2\.20', content, re.S):
              content = re.sub(r'plugins\s*\{', 'plugins {\n id("org.jetbrains.kotlin.android") version "2.2.20" apply false', content, count=1)
          settings.write_text(content)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("ERRO: gradle-wrapper.properties não encontrado.")
          w = wrapper.read_text()
          w = re.sub(r'^distributionUrl=.*$', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip', w, flags=re.M)
          if "distributionUrl=" not in w:
              w += "\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip\n"
          wrapper.write_text(w)

          props = Path("android/gradle.properties")
          p = props.read_text() if props.exists() else ""
          if re.search(r'(?m)^android\.builtInKotlin\s*=', p):
              p = re.sub(r'(?m)^android\.builtInKotlin\s*=.*$', 'android.builtInKotlin=false', p)
          else:
              p = p.rstrip() + "\nandroid.builtInKotlin=false\n"
          props.write_text(p)

          if "9.1.1" not in settings.read_text() or "2.2.20" not in settings.read_text():
              raise SystemExit("ERRO: não consegui fixar AGP 9.1.1 e Kotlin 2.2.20.")
          if "gradle-9.3.1-bin.zip" not in wrapper.read_text():
              raise SystemExit("ERRO: não consegui fixar Gradle 9.3.1.")
          if "android.builtInKotlin=false" not in props.read_
