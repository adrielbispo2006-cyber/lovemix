            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Usando GOOGLE_SERVICES_JSON do GitHub Secrets."
            has_web() { python3 -c "import json,sys; c=json.load(open(sys.argv[1])); sys.exit(0 if any(str(o.get('client_type'))=='3' for cl in c['client'] for o in cl.get('oauth_client',[])) else 1)" "$1" 2>/dev/null; }
            if has_web android/app/google-services.json; then echo "Secret: tem cliente WEB (ok)."; else echo "Secret: SEM cliente WEB."; fi
            if [ -f google-services.json ]; then
              if has_web google-services.json; then echo "Repositório: google-services.json existe e tem cliente WEB."; else echo "Repositório: google-services.json existe, mas SEM cliente WEB (arquivo antigo)."; fi
            else
              echo "Repositório: google-services.json NÃO existe na raiz do projeto."
            fi
            if ! has_web android/app/google-services.json && [ -f google-services.json ] && has_web google-services.json; then
              cp google-services.json android/app/google-services.json
              echo "::warning::O secret GOOGLE_SERVICES_JSON não tem cliente OAuth WEB (client_type 3). Usando o google-services.json do repositório. Atualize ou apague o secret."
            fi
          elif [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "Usando google-services.json incluído no projeto."
          elif [ -f lovemix_work/google-services.json ]; then
            cp lovemix_work/google-services.json android/app/google-services.json
            echo "Usando google-services.json incluído em lovemix_work/."
          else
            echo "ERRO: google-services.json não encontrado; adicione o arquivo ou configure GOOGLE_SERVICES_JSON."
            exit 1
          fi
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          package_name = config["client"][0]["client_info"]["android_client_info"]["package_name"]
          if package_name != "com.example.lovemix":
              raise SystemExit(
                  f"Pacote no google-services.json ({package_name}) diferente do esperado (com.example.lovemix)."
              )
          oauth_clients = config["client"][0].get("oauth_client", [])
          has_web_client = any(str(client.get("client_type")) == "3" for client in oauth_clients)
          if not has_web_client:
              raise SystemExit(
                  "O google-services.json do secret GOOGLE_SERVICES_JSON não contém cliente OAuth WEB (client_type 3). "
                  "Baixe novamente o arquivo no Firebase depois de cadastrar SHA-1/SHA-256 e atualizar a configuração Google."
              )
          web_client = next(
              str(client.get("client_id", ""))
              for client in oauth_clients
              if str(client.get("client_type")) == "3"
          )
          if not web_client.endswith(".apps.googleusercontent.com"):
              raise SystemExit("O cliente OAuth WEB do google-services.json está inválido.")
          with open("/tmp/lovemix-google-client.env", "w") as env_file:
              env_file.write(f"GOOGLE_SERVER_CLIENT_ID={web_client}\n")
          with open(__import__("os").environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"GOOGLE_SERVER_CLIENT_ID={web_client}\n")
          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          if settings.exists():
              s = settings.read_text()
              marker = 'id("com.google.gms.google-services") version "4.4.2" apply false'
              if marker not in s:
                  s = s.replace('plugins {', 'plugins {\n    ' + marker, 1)
                  settings.write_text(s)
          if app.exists():
              s = app.read_text()
              s = re.sub(r'namespace = "[^"]+"', f'namespace = "{package_name}"', s, count=1)
              s = re.sub(r'applicationId = "[^"]+"', f'applicationId = "{package_name}"', s, count=1)
              marker = 'id("com.google.gms.google-services")'
              if marker not in s:
                  s = s.replace('plugins {', 'plugins {\n    ' + marker, 1)
              app.write_text(s)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              s = manifest.read_text()
              permission = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)
              manifest.write_text(s)
          print(f"Package Android configurado para o Firebase: {package_name}")
          PY


      - name: Ativar core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Não encontrei android/app/build.gradle.kts")
          s = gradle.read_text()
          m = re.search(r'compileOptions\s*\{', s)
          if not m:
              raise SystemExit("Bloco compileOptions não encontrado no Gradle Android.")
          start = m.end()
          if "isCoreLibraryDesugaringEnabled" not in s:
              s = s[:start] + '\n        isCoreLibraryDesugaringEnabled = true' + s[start:]
          if "desugar_jdk_libs" not in s:
              dep = re.search(r'dependencies\s*\{', s)
              if dep:
                  pos = dep.end()
                  s = s[:pos] + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' + s[pos:]
              else:
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          gradle.write_text(s)
          print("Core library desugaring ativado.")
          PY

