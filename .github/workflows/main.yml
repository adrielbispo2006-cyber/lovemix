
name: Gerar APK LoveMix

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Baixar projeto
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      # 2. Java
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter
      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Ferramentas
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip curl jq file

      # 5. Extrair ZIP e localizar projeto
      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          if [ -f pubspec.yaml ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERRO: Nenhum ZIP encontrado."
              exit 1
            fi

            unzip -q "$ZIP_FILE" -d extracted

            PUBSPEC="$(find extracted -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' | head -n 1)"

            if [ -z "$PUBSPEC" ]; then
              echo "ERRO: pubspec.yaml não encontrado."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $PROJECT_DIR"

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -d "$PROJECT_DIR/android"

      # 6. Verificar estrutura Android
      - name: Verificar arquivos Android
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"

          if [ ! -f "$ANDROID_DIR/settings.gradle" ] && \
             [ ! -f "$ANDROID_DIR/settings.gradle.kts" ]; then
            echo "ERRO: Configuração Android não encontrada."
            exit 1
          fi

          echo "Estrutura Android encontrada."

      # 7. Preparar Gradle
      - name: Preparar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 8. Gerar Gradle Wrapper
      - name: Gerar Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"
          TEMP_WRAPPER="$(mktemp -d)"

          mkdir -p "$TEMP_WRAPPER"

          cd "$TEMP_WRAPPER"

          printf "rootProject.name = 'wrapper-bootstrap'\n" > settings.gradle
          printf "plugins {}\n" > build.gradle

          gradle wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          mkdir -p "$ANDROID_DIR/gradle/wrapper"

          install -m 0755 gradlew "$ANDROID_DIR/gradlew"
          install -m 0644 gradlew.bat "$ANDROID_DIR/gradlew.bat"

          install -m 0644 \
            gradle/wrapper/gradle-wrapper.jar \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar"

          install -m 0644 \
            gradle/wrapper/gradle-wrapper.properties \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod 755 "$ANDROID_DIR/gradlew"

          test -x "$ANDROID_DIR/gradlew"
          test -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar"

          echo "Gradle Wrapper gerado com sucesso."

      # 9. Corrigir permissão do Gradle
      - name: Corrigir permissão do Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x "$PROJECT_DIR/android/gradlew"

          if [ ! -x "$PROJECT_DIR/android/gradlew" ]; then
            echo "ERRO: Gradle sem permissão de execução."
            exit 1
          fi

          ls -l "$PROJECT_DIR/android/gradlew"

          echo "Permissão de execução confirmada."

      # 10. Preparar cache
      - name: Preparar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: lovemix-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            lovemix-gradle-${{ runner.os }}-

      # 11. Verificar ambiente
      - name: Verificar Java e Flutter
        run: |
          java -version
          flutter --version
          gradle --version

      # 12. Baixar dependências
      - name: Baixar dependências Flutter
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter pub get

      # 13. Verificar Gradle
      - name: Verificar Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          bash ./gradlew --version

          echo "Gradle funcionando corretamente."

      # 14. Compilar APK
      - name: Compilar APK Release
        id: build_apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x android/gradlew

          flutter build apk --release

          APK="$(find build/app/outputs/flutter-apk \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$APK" "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          echo "apk_name=LoveMix-release.apk" >> "$GITHUB_OUTPUT"

          test -s "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          echo "APK compilado com sucesso."

      # 15. Validar APK
      - name: Validar APK
        run: |
          set -euo pipefail

          APK="dist/LoveMix-release.apk"

          test -s "$APK"

          file "$APK"

          echo "APK válido e pronto para publicação."

      # 16. Calcular SHA-1 e SHA-256
      - name: Verificar SHA-1 e SHA-256
        id: hashes
        shell: bash
        run: |
          set -euo pipefail

          APK="dist/LoveMix-release.apk"

          SHA1="$(sha1sum "$APK" | awk '{print $1}')"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          echo "apk_sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "SHA-1: $SHA1"
          echo "SHA-256: $SHA256"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -n "$APKSIGNER" ]; then
            CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"

            CERT_SHA1="$(echo "$CERT_INFO" | \
              sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)"

            CERT_SHA256="$(echo "$CERT_INFO" | \
              sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          else
            CERT_SHA1=""
            CERT_SHA256=""
          fi

          echo "cert_sha1=$CERT_SHA1" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

          {
            echo "LoveMix - Verificação de integridade"
            echo
            echo "APK: LoveMix-release.apk"
            echo
            echo "SHA-1 do arquivo:"
            echo "$SHA1"
            echo
            echo "SHA-256 do arquivo:"
            echo "$SHA256"
            echo
            echo "SHA-1 do certificado:"
            echo "${CERT_SHA1:-Não disponível}"
            echo
            echo "SHA-256 do certificado:"
            echo "${CERT_SHA256:-Não disponível}"
          } > dist/CHECKSUMS.txt

      # 17. Preparar Release
      - name: Preparar Release
        id: release_meta
        run: |
          TAG="lovemix-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=LoveMix ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # 18. Publicar artefatos
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: |
            dist/LoveMix-release.apk
            dist/CHECKSUMS.txt
          if-no-files-found: error
          retention-days: 30

      # 19. Criar Release
      - name: Criar Release para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            # 💜 LoveMix

            APK Release compilado automaticamente.

            SHA-1 e SHA-256 disponíveis no arquivo CHECKSUMS.txt.

            Download disponível nos arquivos desta Release.
          files: |
            dist/LoveMix-release.apk
            dist/CHECKSUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      # 20. Summary roxo e preto
      - name: Mostrar download e SHA no Summary
        if: success()
        env:
          APK_SHA1: ${{ steps.hashes.outputs.apk_sha1 }}
          APK_SHA256: ${{ steps.hashes.outputs.apk_sha256 }}
          CERT_SHA1: ${{ steps.hashes.outputs.cert_sha1 }}
          CERT_SHA256: ${{ steps.hashes.outputs.cert_sha256 }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          {
            echo '<table>'
            echo '<tr><td bgcolor="#160b2e">'
            echo '<h1>💜 LoveMix</h1>'
            echo '<p><b>BUILD CONCLUÍDO COM SUCESSO</b></p>'
            echo '</td></tr>'
            echo '<tr><td bgcolor="#0d1117">'
            echo '<h2>📥 Download do aplicativo</h2>'
            echo '<a href="'$RELEASE_URL'">💜 BAIXAR APK LOVEMIX</a>'
            echo '<br><br>'
            echo '<a href="'$RELEASE_URL'">Abrir Release e baixar arquivos</a>'
            echo '<h2>🔐 SHA-1 e SHA-256 do APK</h2>'
            echo '<b>SHA-1:</b>'
            echo
            echo '```text'
            echo "$APK_SHA1"
            echo '```'
            echo '<b>SHA-256:</b>'
            echo
            echo '```text'
            echo "$APK_SHA256"
            echo '```'
            echo '<h2>📱 Certificado de assinatura</h2>'
            echo '<b>SHA-1 do certificado:</b>'
            echo
            echo '```text'
            echo "${CERT_SHA1:-Não disponível}"
            echo '```'
            echo '<b>SHA-256 do certificado:</b>'
            echo
            echo '```text'
            echo "${CERT_SHA256:-Não disponível}"
            echo '```'
            echo '<h2>📦 Arquivos publicados</h2>'
            echo 'LoveMix-release.apk'
            echo
            echo 'CHECKSUMS.txt'
            echo '</td></tr>'
            echo '</table>'
          } >> "$GITHUB_STEP_SUMMARY"
