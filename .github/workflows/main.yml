
name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'LoveMix-versao-namoro-100-moedas-revisado.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verificar ZIP
        run: |
          ls -lh
          test -f LoveMix-versao-namoro-100-moedas-revisado.zip

      - name: Extrair projeto LoveMix
        run: |
          mkdir -p extraido
          unzip -q LoveMix-versao-namoro-100-moedas-revisado.zip -d extraido
          find extraido -name pubspec.yaml -print

      - name: Localizar projeto Flutter
        run: |
          PROJECT=$(find extraido -name pubspec.yaml -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Não foi encontrado um projeto Flutter dentro do ZIP."
            exit 1
          fi
          cp -a "$PROJECT"/. .

      - name: Corrigir erros de cores Dart
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for p in Path("lib").rglob("*.dart"):
              s = p.read_text(encoding="utf-8")
              novo = s.replace(
                  "Colors.white90",
                  "Colors.white.withOpacity(0.9)"
              )
              if novo != s:
                  p.write_text(novo, encoding="utf-8")
                  print(f"Corrigido: {p}")

          print("Verificação de cores concluída!")
          PY

      - name: Criar arquivos Android
        run: flutter create . --platforms=android

      - name: Corrigir Desugaring Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          kts = p.exists()

          if not kts:
              p = Path("android/app/build.gradle")

          s = p.read_text()

          if kts:
              flag = "isCoreLibraryDesugaringEnabled = true"
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              flag = "coreLibraryDesugaringEnabled true"
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if flag not in s:
              pos = s.find("compileOptions {")
              if pos == -1:
                  raise Exception("compileOptions nao encontrado")
              pos += len("compileOptions {")
              s = s[:pos] + "\n        " + flag + s[pos:]

          if dep not in s:
              marker = "dependencies {"
              pos = s.find(marker)
              if pos == -1:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"
              else:
                  pos += len(marker)
                  s = s[:pos] + "\n    " + dep + s[pos:]

          p.write_text(s)
          print("Desugaring configurado!")
          PY

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar código Dart
        run: flutter analyze --no-pub

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: lovemix-apk
          path: build/app/outputs/flutter-apk/app-release.apk
