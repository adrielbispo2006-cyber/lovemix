      - name: Compilar APK release
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/lovemix-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            echo "Tentativa $attempt de 3 para gerar o APK..."
            if flutter build apk --release --no-shrink --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "A compilação falhou. Aguardando 20 segundos antes de tentar novamente..."
              sleep 20
            fi
          done
          echo "ERRO: não foi possível gerar o APK após 3 tentativas."
          exit 1

      - name: Verificar assinatura do APK
        continue-on-error: true
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK" || { echo "ERRO: APK não encontrado."; exit 1; }
          APKSIGNER="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Usando $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Mostrar SHA-1 e SHA-256 do APK
        continue-on-error: true
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"

          # Formata como o Firebase espera: AA:BB:CC:...
          fmt() { echo "$1" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//'; }

          SHA1_RAW="$(echo "$CERTS" | grep -m1 'certificate SHA-1 digest' | awk '{print $NF}')"
          SHA256_RAW="$(echo "$CERTS" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
          [ -n "$SHA1_RAW" ] && [ -n "$SHA256_RAW" ] || { echo "ERRO: não consegui ler os SHA."; echo "$CERTS"; exit 1; }
          SHA1="$(fmt "$SHA1_RAW")"
          SHA256="$(fmt "$SHA256_RAW")"

          {
            echo "SHA-1:   $SHA1"
            echo "SHA-256: $SHA256"
          } | tee build/sha-firebase.txt

          {
            echo "## Impressões digitais do certificado (para o Firebase)"
            echo ""
            echo "**SHA-1**"
            echo '```'
            echo "$SHA1"
            echo '```'
            echo "**SHA-256**"
            echo '```'
            echo "$SHA256"
            echo '```'
            echo "Firebase Console > Configurações do projeto > Seus apps > Android > Adicionar impressão digital."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=SHA-1::$SHA1"
          echo "::notice title=SHA-256::$SHA256"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: lovemix-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/sha-firebase.txt
