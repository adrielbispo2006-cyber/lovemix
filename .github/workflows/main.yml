
name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' | sort)

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Deixe somente um ZIP na raiz."
            exit 1
          fi

          unzip -t "${ZIPS[0]}"
          mkdir -p extracted
          unzip -q "${ZIPS[0]}" -d extracted

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"
            if [ -s "$DIR/lib/main.dart" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name pubspec.yaml -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Flutter não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar arquivos obrigatórios
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          for FILE in pubspec.yaml lib/main.dart android/gradlew android/gradle/wrapper/gradle-wrapper.properties android/app/src/main/AndroidManifest.xml; do
            test -s "$FILE" || {
              echo "::error::Arquivo ausente: $FILE"
              exit 1
            }
          done

      - name: Conferir versão do Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          WRAPPER_FILE="android/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_URL="$(grep -E '^distributionUrl=' "$WRAPPER_FILE" | cut -d= -f2- | tr -d '\\')"

          echo "Gradle configurado: $GRADLE_URL"

          if [[ "$GRADLE_URL" != *"gradle-9.3.1-"* ]]; then
            echo "::error::O ZIP não contém Gradle 9.3.1."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Verificar ambiente
        run: |
          flutter --version
          java -version
          flutter doctor -v

      - name: Baixar dependências Flutter
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Verificar dependências
        run: |
          cd "$PROJECT_DIR"
          flutter pub deps
          test -s pubspec.lock

      - name: Analisar código Flutter
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK Release
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Localizar e validar APK
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/LoveMix.apk"

      - name: Gerar SHA-1 e SHA-256
        run: |
          cd "$GITHUB_WORKSPACE/apk-final"

          sha1sum LoveMix.apk | awk '{print $1}' > sha1.txt
          sha256sum LoveMix.apk | awk '{print $1}' > sha256.txt

          {
            echo "## LOVE MIX - ASSINATURAS"
            echo "SHA-1: $(cat sha1.txt)"
            echo "SHA-256: $(cat sha256.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "SHA-1 DO APK:"
            cat sha1.txt
            echo ""
            echo "SHA-256 DO APK:"
            cat sha256.txt
          } > checksums.txt

      - name: Enviar APK e assinaturas
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK-Release
          path: |
            apk-final/LoveMix.apk
            apk-final/checksums.txt
          if-no-files-found: error
          retention-days: 30
