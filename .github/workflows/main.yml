name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml && -f lib/main.dart ]]; then
            echo "Projeto Flutter encontrado na raiz."
            exit 0
          fi

          found=""
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [[ -f "$d/lib/main.dart" ]]; then found="$d"; break; fi
          done < <(find . -maxdepth 5 -name pubspec.yaml -not -path './.git/*' -not -path '*/node_modules/*' | sort)

          if [[ -n "$found" ]]; then
            echo "Projeto encontrado em $found; copiando para a raiz."
            cp -a "$found"/. .
            exit 0
          fi

          while IFS= read -r z; do
            rm -rf /tmp/lovemix_zip && mkdir -p /tmp/lovemix_zip
            if unzip -q "$z" -d /tmp/lovemix_zip 2>/dev/null; then
              while IFS= read -r f; do
                d="$(dirname "$f")"
                if [[ -f "$d/lib/main.dart" ]]; then
                  echo "Projeto encontrado dentro de $z; copiando para a raiz."
                  cp -a "$d"/. .
                  exit 0
                fi
              done < <(find /tmp/lovemix_zip -maxdepth 5 -name pubspec.yaml | sort)
            fi
          done < <(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | sort -r)

          echo "::error::Não encontrei pubspec.yaml e lib/main.dart."
          find . -maxdepth 3 -not -path './.git/*' | sort | head -80
          exit 1

      - name: Conferir arquivos essenciais
        run: |
          test -s pubspec.yaml
          test -s lib/main.dart
          grep -q 'name: lovemix' pubspec.yaml || echo "::warning::O nome do pacote no pubspec.yaml não é lovemix."

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar dependência permission_handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('pubspec.yaml')
          s = p.read_text()
          # Evita que uma resolução recente do plugin Android exija APIs Android
          # mais novas que as disponíveis no ambiente de compilação.
          if re.search(r'(?m)^dependency_overrides\s*:', s):
              if re.search(r'(?m)^\s+permission_handler_android\s*:', s):
                  s = re.sub(r'(?m)^(\s+permission_handler_android\s*:\s*).+$', r'\g<1>13.0.1', s)
              else:
                  s = re.sub(r'(?m)^dependency_overrides\s*:\s*$',
                             'dependency_overrides:\n  permission_handler_android: 13.0.1', s, count=1)
          else:
              s = s.rstrip() + '\n\ndependency_overrides:\n  permission_handler_android: 13.0.1\n'
          p.write_text(s)
          print('permission_handler_android fixado em 13.0.1.')
          PY

      - name: Criar estrutura Android
        run: flutter create . --platforms=android

      - name: Configurar Gradle, Firebase e permissões Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          # O Flutter pode criar arquivos Kotlin DSL (.kts) ou Groovy (.gradle).
          settings = next((p for p in [Path('android/settings.gradle.kts'), Path('android/settings.gradle')] if p.exists()), None)
          app = next((p for p in [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')] if p.exists()), None)
          root = next((p for p in [Path('android/build.gradle.kts'), Path('android/build.gradle')] if p.exists()), None)
          if not settings or not app:
              raise SystemExit('Não encontrei os arquivos Gradle Android criados pelo Flutter.')

          # Ativa o plugin Google Services no arquivo de plugins do projeto.
          s = settings.read_text()
          if settings.suffix == '.kts':
              marker = 'id("com.google.gms.google-services") version "4.4.2" apply false'
              if 'com.google.gms.google-services' not in s:
                  if re.search(r'(?m)^plugins\s*\{', s):
                      s = re.sub(r'(?m)^plugins\s*\{', 'plugins {\n    ' + marker, s, count=1)
                  else:
                      s += '\nplugins { ' + marker + ' }\n'
          else:
              marker = "id 'com.google.gms.google-services' version '4.4.2' apply false"
              if 'com.google.gms.google-services' not in s:
                  if re.search(r'(?m)^plugins\s*\{', s):
                      s = re.sub(r'(?m)^plugins\s*\{', 'plugins {\n    ' + marker, s, count=1)
                  else:
                      s += '\nplugins { ' + marker + ' }\n'
          settings.write_text(s)

          a = app.read_text()
          if app.suffix == '.kts':
              if 'com.google.gms.google-services' not in a:
                  a = re.sub(r'(?m)^plugins\s*\{', 'plugins {\n    id("com.google.gms.google-services")', a, count=1)
              # compileSdk e Java 17
              if re.search(r'compileSdk\s*=\s*[^\n]+', a):
                  a = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', a, count=1)
              if 'isCoreLibraryDesugaringEnabled' not in a:
                  a = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', a, count=1)
              if 'coreLibraryDesugaring(' not in a:
                  dep = 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}'
                  if re.search(r'dependencies\s*\{', a):
                      a = re.sub(r'dependencies\s*\{', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', a, count=1)
                  else:
                      a += '\n' + dep + '\n'
              if 'sourceCompatibility' in a:
                  a = re.sub(r'JavaVersion\.VERSION_\d+', 'JavaVersion.VERSION_17', a)
              if 'jvmTarget' in a:
                  a = re.sub(r'JvmTarget\.JVM_\d+', 'JvmTarget.JVM_17', a)
          else:
              if 'com.google.gms.google-services' not in a:
                  a = re.sub(r'(?m)^plugins\s*\{', "plugins {\n    id 'com.google.gms.google-services'", a, count=1)
              a = re.sub(r'compileSdk\s+[^\n]+', 'compileSdk 36', a, count=1)
              if 'coreLibraryDesugaringEnabled' not in a:
                  a = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        coreLibraryDesugaringEnabled true', a, count=1)
              if 'coreLibraryDesugaring ' not in a and 'coreLibraryDesugaring(' not in a:
                  dep = "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}"
                  if re.search(r'dependencies\s*\{', a):
                      a = re.sub(r'dependencies\s*\{', "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'", a, count=1)
                  else:
                      a += '\n' + dep + '\n'
              a = re.sub(r'JavaVersion\.VERSION_\d+', 'JavaVersion.VERSION_17', a)
          app.write_text(a)

          # Copia o arquivo Firebase para o local esperado pelo Google Services.
          candidates = [Path('google-services.json'), Path('android/google-services.json'), Path('lovemix_work/google-services.json')]
          firebase = next((p for p in candidates if p.exists() and p.stat().st_size), None)
          if not firebase:
              raise SystemExit('google-services.json não encontrado. Adicione o arquivo correto do Firebase ao projeto.')
          config = json.loads(firebase.read_text())
          clients = config.get('client', [])
          if not clients:
              raise SystemExit('google-services.json não contém a lista client.')
          package_name = clients[0]['client_info']['android_client_info']['package_name']
          Path('android/app').mkdir(parents=True, exist_ok=True)
          Path('android/app/google-services.json').write_text(firebase.read_text())

          # Mantém o applicationId alinhado ao pacote registrado no Firebase.
          if app.suffix == '.kts':
              if re.search(r'applicationId\s*=\s*"[^"]+"', a):
                  a = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{package_name}"', a, count=1)
              if re.search(r'namespace\s*=\s*"[^"]+"', a):
                  a = re.sub(r'namespace\s*=\s*"[^"]+"', f'namespace = "{package_name}"', a, count=1)
          else:
              a = re.sub(r'applicationId\s+["\'][^"\']+["\']', f"applicationId '{package_name}'", a, count=1)
              a = re.sub(r'namespace\s+["\'][^"\']+["\']', f"namespace '{package_name}'", a, count=1)
          app.write_text(a)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          perms = ['android.permission.INTERNET', 'android.permission.CAMERA',
                   'android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS',
                   'android.permission.POST_NOTIFICATIONS']
          for perm in perms:
              tag = f'<uses-permission android:name="{perm}" />'
              if perm not in m:
                  m = m.replace('<application', '    ' + tag + '\n    <application', 1)
          manifest.write_text(m)
          print(f'Firebase configurado para {package_name}; compileSdk 36 e desugaring ativados.')
          PY

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Gerar ícones Android
        run: dart run flutter_launcher_icons

      - name: Verificar código Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK release
        run: flutter build apk --release --no-shrink

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: lovemix-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
