
name: Gerar APK LoveMix

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lovemix-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar LoveMix
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # 1. Baixar projeto
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter
      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Preparar Android SDK sem pacote obsoleto tools
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK não encontrado: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          echo "SDK: $SDK_ROOT"
          echo "SDK Manager: $SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "platform-tools"

          echo "Android SDK instalado."

      # 5. Ferramentas auxiliares
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip curl jq file python3

      # 6. Localizar projeto
      - name: Localizar projeto LoveMix
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          if [[ -f "$GITHUB_WORKSPACE/pubspec.yaml" && \
                -f "$GITHUB_WORKSPACE/lib/main.dart" ]]; then

            PROJECT_DIR="$GITHUB_WORKSPACE"

          else

            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Nenhum ZIP encontrado."
              exit 1
            fi

            echo "Extraindo projeto: $ZIP_FILE"

            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

            PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" \
              -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' | head -n 1)"

            if [[ -z "$PUBSPEC" ]]; then
              echo "::error::pubspec.yaml não encontrado."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -d "$PROJECT_DIR/android"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado: $PROJECT_DIR"

      # 7. Configurar Gradle 9.3.1
      - name: Instalar Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            --output /tmp/gradle-9.3.1.zip

          unzip -q -o /tmp/gradle-9.3.1.zip -d /tmp

          GRADLE_BIN="/tmp/gradle-9.3.1/bin/gradle"

          test -x "$GRADLE_BIN"

          "$GRADLE_BIN" --version

          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"

          cat > "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties" <<'PROPERTIES'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=120000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPERTIES

          cat > "$PROJECT_DIR/android/gradlew" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec /tmp/gradle-9.3.1/bin/gradle "$@"
          SCRIPT

          chmod 755 "$PROJECT_DIR/android/gradlew"

          echo "Gradle 9.3.1 configurado."

      # 8. Validar SDK e configurações Android
      - name: Validar configurações Android
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"

          SETTINGS="$ANDROID_DIR/settings.gradle"

          if [[ ! -f "$SETTINGS" ]]; then
            SETTINGS="$ANDROID_DIR/settings.gradle.kts"
          fi

          grep -q 'com.android.application' "$SETTINGS"
          grep -q 'org.jetbrains.kotlin.android' "$SETTINGS"

          grep -q 'compileSdk 37' \
            "$ANDROID_DIR/app/build.gradle" || \
          grep -q 'compileSdk = 37' \
            "$ANDROID_DIR/app/build.gradle.kts"

          test -d "$ANDROID_HOME/platforms/android-37"

          grep -Fq 'gradle-9.3.1-bin.zip' \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"

          echo "Configuração Android validada."

      # 9. Cache Gradle
      - name: Preparar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: lovemix-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.yaml') }}
          restore-keys: |
            lovemix-gradle-${{ runner.os }}-

      # 10. Assinatura persistente opcional
      - name: Configurar assinatura persistente
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "Keystore não configurado."
            echo "Será utilizada a assinatura configurada no projeto."
            exit 0
          fi

          if [[ -z "${STORE_PASSWORD:-}" || \
                -z "${KEY_ALIAS:-}" || \
                -z "${KEY_PASSWORD:-}" ]]; then
            echo "::error::Configure todos os secrets ANDROID."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/lovemix-signing"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/lovemix-signing/release.jks"

          test -s "$RUNNER_TEMP/lovemix-signing/release.jks"

          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lovemix-signing/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Assinatura persistente configurada."

      # 11. Dependências Flutter
      - name: Baixar dependências Flutter
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      # 12. Compatibilidade dos repositórios ZEGO
      - name: Corrigir repositórios ZEGO
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache/hosted/pub.dev"

          for android_dir in cache.glob("zego_*/android"):
              files = (
                  list(android_dir.glob("*.gradle")) +
                  list(android_dir.glob("*.gradle.kts"))
              )

              for gradle_file in files:
                  original = gradle_file.read_text()

                  updated = re.sub(
                      r"\bjcenter\s*\(\s*\)",
                      "mavenCentral()",
                      original
                  )

                  if updated != original:
                      gradle_file.write_text(updated)
                      print("Corrigido:", gradle_file)

          print("Verificação ZEGO concluída.")
          PY

      # 13. Validar ambiente
      - name: Validar Java Flutter e Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          java -version
          flutter --version

          echo "Android SDK:"
          ls "$ANDROID_HOME/platforms/android-37"

          cd android

          ./gradlew --version | tee /tmp/lovemix-gradle.txt

          grep -q 'Gradle 9.3.1' /tmp/lovemix-gradle.txt

          echo "Ambiente validado."

      # 14. Compilar APK
      - name: Compilar APK Release
        id: build_apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Compilando LoveMix..."

          flutter build apk --release -v

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            APK="$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
              -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          fi

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::APK não foi gerado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$APK" "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          test -s "$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          echo "APK LoveMix gerado."

      # 15. Validar APK
      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          test -s "$APK"

          file "$APK"

          echo "APK validado."

      # 16. SHA-1 e SHA-256
      - name: Calcular SHA-1 SHA-256 e fingerprints
        id: hashes
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/dist/LoveMix-release.apk"

          FILE_SHA1="$(sha1sum "$APK" | awk '{print $1}')"
          FILE_SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1 || true)"

          CERT_SHA1="Não disponível"
          CERT_SHA256="Não disponível"

          if [[ -n "$APKSIGNER" ]]; then

            CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"

            CERT_SHA1="$(printf '%s\n' "$CERT_INFO" |
              sed -n 's/.*certificate SHA-1 digest: *//p' | head -n 1)"

            CERT_SHA256="$(printf '%s\n' "$CERT_INFO" |
              sed -n 's/.*certificate SHA-256 digest: *//p' | head -n 1)"

            CERT_SHA1="${CERT_SHA1:-Não disponível}"
            CERT_SHA256="${CERT_SHA256:-Não disponível}"
          fi

          {
            echo "file_sha1=$FILE_SHA1"
            echo "file_sha256=$FILE_SHA256"
            echo "cert_sha1=$CERT_SHA1"
            echo "cert_sha256=$CERT_SHA256"
          } >> "$GITHUB_OUTPUT"

          {
            echo "LoveMix - Verificação de integridade"
            echo
            echo "SHA-1 do arquivo:"
            echo "$FILE_SHA1"
            echo
            echo "SHA-256 do arquivo:"
            echo "$FILE_SHA256"
            echo
            echo "SHA-1 do certificado:"
            echo "$CERT_SHA1"
            echo
            echo "SHA-256 do certificado:"
            echo "$CERT_SHA256"
          } > "$GITHUB_WORKSPACE/dist/CHECKSUMS.txt"

          echo "Hashes calculados."

      # 17. Publicar APK como artefato
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: |
            dist/LoveMix-release.apk
            dist/CHECKSUMS.txt
          if-no-files-found: error
          retention-days: 30

      # 18. Preparar Release
      - name: Preparar Release
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="lovemix-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=LoveMix ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # 19. Criar Release
      - name: Criar Release para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            # 💜 LoveMix

            APK Release compilado automaticamente.

            Android SDK 37.
            Gradle 9.3.1.
            Java 17.

            SHA-1 e SHA-256 disponíveis em CHECKSUMS.txt.
          files: |
            dist/LoveMix-release.apk
            dist/CHECKSUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      # 20. Mostrar download e SHA
      - name: Mostrar download e SHA no Summary
        if: success()
        env:
          FILE_SHA1: ${{ steps.hashes.outputs.file_sha1 }}
          FILE_SHA256: ${{ steps.hashes.outputs.file_sha256 }}
          CERT_SHA1: ${{ steps.hashes.outputs.cert_sha1 }}
          CERT_SHA256: ${{ steps.hashes.outputs.cert_sha256 }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          {
            echo "# 💜 LoveMix"
            echo
            echo "## BUILD CONCLUÍDO COM SUCESSO"
            echo
            echo "### [📥 BAIXAR APK LOVEMIX]($RELEASE_URL)"
            echo
            echo "### SHA-1 do arquivo"
            echo '```text'
            echo "$FILE_SHA1"
            echo '```'
            echo
            echo "### SHA-256 do arquivo"
            echo '```text'
            echo "$FILE_SHA256"
            echo '```'
            echo
            echo "### Certificado Firebase/Google"
            echo
            echo "**SHA-1:**"
            echo '```text'
            echo "$CERT_SHA1"
            echo '```'
            echo
            echo "**SHA-256:**"
            echo '```text'
            echo "$CERT_SHA256"
            echo '```'
            echo
            echo "### Arquivos publicados"
            echo "- LoveMix-release.apk"
            echo "- CHECKSUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"
