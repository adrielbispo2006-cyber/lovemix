name: Vida Real RP - Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK do Vida Real RP
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar projeto Godot
        run: |
          for Z in *.zip; do
            [ -f "$Z" ] || continue
            echo "Descompactando $Z"
            mkdir -p _projeto
            unzip -q -o "$Z" -d _projeto
          done
          FILE=$(find . -name project.godot -not -path "./.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::project.godot NAO encontrado no repositorio. Arquivos enviados:"
            find . -not -path "./.git/*" -type f | head -n 50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Projeto Godot encontrado em: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" \
            "cmdline-tools;latest" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;35.0.1"

      - name: Instalar Godot 4.4.1 e templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configurar Godot para exportar Android
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Criar export_presets.cfg se faltar
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f export_presets.cfg ]; then
            echo "export_presets.cfg ja existe, mantendo o seu."
          else
            echo "Criando export_presets.cfg padrao para Android."
            cat > export_presets.cfg <<'CFG'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.vidarealrp.game"
          package/name="Vida Real RP"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          screen/immersive_mode=true
          permissions/internet=true
          CFG
          fi

      - name: Verificar arquivos do projeto
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f project.godot || { echo "::error::project.godot faltando"; exit 1; }
          test -f export_presets.cfg || { echo "::error::export_presets.cfg faltando. Crie em Projeto > Exportar > Adicionar > Android e envie ao repositorio."; exit 1; }
          test -f icon.png || echo "::warning::icon.png nao encontrado"
          echo "Arquivos encontrados."

      - name: Importar projeto
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --editor --path . --quit

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build
          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/VidaRealRP.apk || {
              echo "===== DIAGNOSTICO ====="
              echo "ANDROID_HOME=$ANDROID_HOME"
              echo "JAVA_HOME=$JAVA_HOME"
              ls "$ANDROID_HOME" || true
              ls "$ANDROID_HOME/cmdline-tools" || true
              ls "$ANDROID_HOME/build-tools" || true
              ls "$ANDROID_HOME/platforms" || true
              cat "$HOME/.config/godot/editor_settings-4.4.tres" || true
              cat export_presets.cfg || true
              exit 1
            }

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: VidaRealRP-APK-Android
          path: ${{ env.PROJECT_DIR }}/build/VidaRealRP.apk
          if-no-files-found: error
          retention-days: 14
