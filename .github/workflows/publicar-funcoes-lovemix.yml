name: Publicar funções LoveMix (presentes)

on:
  workflow_dispatch:
    inputs:
      escopo:
        description: 'O que publicar'
        required: true
        default: 'so-presentes'
        type: choice
        options:
          - so-presentes
          - todas-as-funcoes

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar no Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Achar a pasta do projeto
        id: dir
        run: |
          if [ -f lovemix/functions/package.json ]; then
            echo "root=lovemix" >> "$GITHUB_OUTPUT"
          elif [ -f functions/package.json ]; then
            echo "root=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::Não achei functions/package.json. Suba a pasta 'functions' do ZIP para o repositório."
            exit 1
          fi

      - name: Conferir o secret do Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOVEMIX_73849 }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta o secret FIREBASE_SERVICE_ACCOUNT_LOVEMIX_73849 (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Autenticar no Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOVEMIX_73849 }}'

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Instalar dependências e compilar
        working-directory: ${{ steps.dir.outputs.root }}/functions
        run: |
          npm install
          npm run build

      - name: Publicar só os presentes (sendRoomGift)
        if: ${{ inputs.escopo == 'so-presentes' }}
        working-directory: ${{ steps.dir.outputs.root }}
        run: firebase deploy --only functions:sendRoomGift --project lovemix-73849 --non-interactive --force

      - name: Publicar todas as funções
        if: ${{ inputs.escopo == 'todas-as-funcoes' }}
        working-directory: ${{ steps.dir.outputs.root }}
        run: firebase deploy --only functions --project lovemix-73849 --non-interactive --force
