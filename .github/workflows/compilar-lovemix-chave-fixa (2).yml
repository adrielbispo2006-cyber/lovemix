
name: Gerar APK LoveMix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Localizar projeto
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -d lovemix ] && [ -f lovemix/pubspec.yaml ]; then
            echo "PROJECT_DIR=lovemix" >> $GITHUB_ENV
          else
            mkdir -p _source
            ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "Projeto Flutter não encontrado."
              exit 1
            fi
            unzip -q "$ZIP" -d _source
            PROJECT=$(find _source -name pubspec.yaml -printf '%h\n' | head -n 1)
            if [ -z "$PROJECT" ]; then
              echo "pubspec.yaml não encontrado."
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV
          fi

      - name: Configurar chave persistente
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERRO: configure os quatro secrets da assinatura Android."
            exit 1
          fi

          mkdir -p "$HOME/lovemix-signing"
          echo "$KEY_BASE64" | base64 -d > "$HOME/lovemix-signing/lovemix.jks"

          echo "ANDROID_KEYSTORE_PATH=$HOME/lovemix-signing/lovemix.jks" >> $GITHUB_ENV

      - name: Instalar dependências
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Compilar APK Release
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release

      - name: Calcular SHA-1 e SHA-256
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$HOME/lovemix-signing/lovemix.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > fingerprints.txt

          SHA1=$(grep -m1 'SHA1:' fingerprints.txt | sed 's/.*SHA1: //')
          SHA256=$(grep -m1 'SHA256:' fingerprints.txt | sed 's/.*SHA256: //')

          echo "## 🔐 LoveMix - Certificados Firebase" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SHA-1" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$SHA1" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### SHA-256" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$SHA256" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "SHA-1: $SHA1"
          echo "SHA-256: $SHA256"

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp "${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk" dist/LoveMix-release.apk

      - name: Salvar APK e fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK-e-Fingerprints
          path: |
            dist/LoveMix-release.apk
            fingerprints.txt
          retention-days: 30
