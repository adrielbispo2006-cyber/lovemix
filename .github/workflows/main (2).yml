
name: Gerar APK Appsdroid

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: appsdroid-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Appsdroid
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar Android SDK API 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Atualizar compileSdk para 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('android/app/build.gradle'),
              Path('android/app/build.gradle.kts')
          ]

          f = next((p for p in files if p.exists()), None)
          if f is None:
              raise SystemExit('Arquivo Gradle Android não encontrado')

          s = f.read_text()
          s, n1 = re.subn(
              r'compileSdkVersion\s+flutter.compileSdkVersion',
              'compileSdkVersion 36', s)
          s, n2 = re.subn(
              r'compileSdk\s*=\s*flutter.compileSdkVersion',
              'compileSdk = 36', s)
          s, n3 = re.subn(
              r'compileSdkVersion\s+\d+',
              'compileSdkVersion 36', s)
          s, n4 = re.subn(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36', s)

          if not n1 + n2 + n3 + n4:
              raise SystemExit('Não foi possível atualizar compileSdk')

          f.write_text(s)
          print('compileSdk atualizado para 36')
          PY

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar código
        run: flutter analyze

      - name: Compilar APK
        run: flutter build apk --release

      - name: Calcular SHA-1 e SHA-256
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          SHA1=$(sha1sum "$APK" | awk '{print $1}')
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "## APK Appsdroid" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-1: $SHA1" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Appsdroid-APK-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
