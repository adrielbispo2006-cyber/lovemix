
name: Gerar APK Appsdroid

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '**/*.dart'
      - '**/*.yaml'
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: appsdroid-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Appsdroid
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar projeto Flutter
        shell: bash
        run: |
          set -euo pipefail

          if [ -f pubspec.yaml ]; then
            PROJECT_DIR="."
          else
            PUBSPEC=$(find . -mindepth 2 -maxdepth 4 \
              -type f -name pubspec.yaml \
              -not -path './appsrc/*' -print -quit)

            if [ -n "$PUBSPEC" ]; then
              PROJECT_DIR=$(dirname "$PUBSPEC")
            else
              mapfile -t ZIPS < <(
                find . -maxdepth 1 -type f -iname '*.zip'
              )

              if [ "${#ZIPS[@]}" -ne 1 ]; then
                echo "ERRO: coloque apenas um ZIP do Appsdroid na raiz."
                exit 1
              fi

              mkdir -p appsrc
              unzip -q "${ZIPS[0]}" -d appsrc

              PUBSPEC=$(find appsrc -type f \
                -name pubspec.yaml -print -quit)

              if [ -z "$PUBSPEC" ]; then
                echo "ERRO: pubspec.yaml não encontrado."
                exit 1
              fi

              PROJECT_DIR=$(dirname "$PUBSPEC")
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT_DIR"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configurar Java no Flutter
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          java -version
          flutter --version

      - name: Gerar estrutura Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            flutter create \
              --platforms=android \
              --org com.appsdroid \
              --project-name appsdroid \
              .
          fi

          test -f android/app/src/main/AndroidManifest.xml

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f -name sdkmanager -print -quit)
          fi

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configurar compileSdk 36
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          gradle = next((p for p in files if p.is_file()), None)

          if gradle is None:
              raise SystemExit("Gradle do aplicativo não encontrado.")

          content = gradle.read_text()

          patterns = [
              (r'compileSdkVersion\s+flutter\.compileSdkVersion',
               'compileSdkVersion 36'),
              (r'compileSdk\s*=\s*flutter\.compileSdkVersion',
               'compileSdk = 36'),
              (r'compileSdkVersion\s+\d+',
               'compileSdkVersion 36'),
              (r'compileSdk\s*=\s*\d+',
               'compileSdk = 36'),
              (r'compileSdk\s+flutter\.compileSdkVersion',
               'compileSdk 36')
          ]

          changed = False

          for pattern, replacement in patterns:
              content, count = re.subn(pattern, replacement, content)
              changed = changed or count > 0

          if not changed:
              raise SystemExit("Não foi possível configurar compileSdk.")

          gradle.write_text(content)
          print("compileSdk 36 configurado.")
          PY

      - name: Corrigir tarefa Lint problemática
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.is_file():
              p = groovy
              block = """

          // Contorna falha interna do Lint identificada no build.
          tasks.configureEach { task ->
              if (task.name == "lintVitalAnalyzeRelease") {
                  task.enabled = false
              }
          }
          """
          elif kotlin.is_file():
              p = kotlin
              block = """

          // Contorna falha interna do Lint identificada no build.
          tasks.configureEach {
              if (name == "lintVitalAnalyzeRelease") {
                  enabled = false
              }
          }
          """
          else:
              raise SystemExit("Arquivo Gradle não encontrado.")

          content = p.read_text()

          if "lintVitalAnalyzeRelease" not in content:
              p.write_text(content + block)

          print("Configuração da tarefa Lint aplicada.")
          PY

      - name: Limpar projeto
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      - name: Instalar dependências
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Verificar ambiente
        run: flutter doctor -v

      - name: Compilar APK Release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verificar APK e calcular hashes
        id: hashes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          SHA1=$(sha1sum "$APK" | awk '{print $1}')
          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          {
            echo "## Appsdroid - APK Release"
            echo ""
            echo "**SHA-1:**"
            echo "\`$SHA1\`"
            echo ""
            echo "**SHA-256:**"
            echo "\`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Appsdroid-APK-Release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Mostrar link do APK
        env:
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo ""
            echo "### Download"
            echo "[BAIXAR APK APPSDROID]($APK_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
