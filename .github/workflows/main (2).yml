
name: Gerar APK Clouddroid Gaming

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clouddroid-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Clouddroid Gaming
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair e localizar projeto Flutter
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Extraindo $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

          if [ -f "./ClouddroidGaming/pubspec.yaml" ]; then
            PROJECT_DIR="./ClouddroidGaming"
          elif [ -f "./pubspec.yaml" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(find . -name pubspec.yaml \
              -not -path './.git/*' \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: pubspec.yaml não encontrado."
            echo "Envie o ZIP do projeto Clouddroid Gaming para o repositório."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Verificar projeto
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Gerar APK Release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Mostrar SHA-1 e SHA-256
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd build/app/outputs/flutter-apk
          sha1sum app-release.apk
          sha256sum app-release.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Clouddroid-Gaming-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
