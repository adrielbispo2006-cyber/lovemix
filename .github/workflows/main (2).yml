
name: Compilar Appsdroid

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Instalar SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configurar Java no Flutter
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter doctor -v

      - name: Localizar projeto Flutter
        id: project
        run: |
          if [ -f pubspec.yaml ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            ZIP=$(find . -maxdepth 1 -iname '*.zip' -type f | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "Nenhum ZIP encontrado"
              exit 1
            fi

            mkdir -p extraido
            unzip -q "$ZIP" -d extraido

            PUBSPEC=$(find extraido -name pubspec.yaml -type f | head -n 1)

            if [ -z "$PUBSPEC" ]; then
              echo "pubspec.yaml não encontrado"
              exit 1
            fi

            echo "dir=$(dirname "$PUBSPEC")" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar Android
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.appsdroid .
          fi

      - name: Atualizar compileSdk
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          f = next((x for x in files if x.exists()), None)

          if f is None:
              raise SystemExit("Arquivo Gradle não encontrado")

          s = f.read_text()

          s, n = re.subn(
              r'(?m)^(\s*)compileSdkVersion\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)',
              r'\1compileSdk = 36',
              s,
              count=1
          )

          if n == 0:
              s, n = re.subn(
                  r'(?m)^(\s*)compileSdk\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)',
                  r'\1compileSdk = 36',
                  s,
                  count=1
              )

          if n == 0:
              raise SystemExit("Não foi possível localizar compileSdk")

          f.write_text(s)
          print("compileSdk atualizado para 36")
          PY

      - name: Baixar dependências
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk --release

      - name: Verificar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Appsdroid-APK-Release
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
