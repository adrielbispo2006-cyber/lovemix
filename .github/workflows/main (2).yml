
name: Gerar APK Clouddroid Gaming

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clouddroid-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Clouddroid Gaming
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar projeto
        run: flutter analyze

      - name: Gerar APK
        run: flutter build apk --release

      - name: Mostrar SHA-1 e SHA-256
        run: |
          cd build/app/outputs/flutter-apk
          sha1sum app-release.apk
          sha256sum app-release.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Clouddroid-Gaming-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
