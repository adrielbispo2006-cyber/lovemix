
name: Gerar APK Appsdroid

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: appsdroid-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Appsdroid
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar e extrair projeto Flutter
        shell: bash
        run: |
          set -e

          if [ -f pubspec.yaml ]; then
            PROJECT_DIR="."
          else
            ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: ZIP não encontrado."
              exit 1
            fi

            mkdir -p appsrc
            unzip -q "$ZIP" -d appsrc

            PUBSPEC=$(find appsrc -type f -name pubspec.yaml | head -n 1)

            if [ -z "$PUBSPEC" ]; then
              echo "ERRO: pubspec.yaml não encontrado."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PUBSPEC")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            flutter create \
              --platforms=android \
              --org com.appsdroid \
              --project-name appsdroid \
              .
          fi

          test -f android/app/src/main/AndroidManifest.xml

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f -name sdkmanager | head -n 1)
          fi

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Instalar dependências Flutter
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Corrigir compileSdk do App e Plugins
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          roots = [Path("android")]

          cache = Path(
              os.environ.get(
                  "PUB_CACHE",
                  str(Path.home() / ".pub-cache")
              )
          )

          if cache.exists():
              roots.append(cache)

          patterns = [
              (r'compileSdkVersion\s+flutter\.compileSdkVersion',
               'compileSdkVersion 36'),
              (r'compileSdk\s*=\s*flutter\.compileSdkVersion',
               'compileSdk = 36'),
              (r'compileSdk\s+flutter\.compileSdkVersion',
               'compileSdk 36'),
              (r'compileSdkVersion\s+\d+',
               'compileSdkVersion 36'),
              (r'compileSdk\s*=\s*\d+',
               'compileSdk = 36'),
              (r'compileSdk\s+\d+',
               'compileSdk 36')
          ]

          checked = 0
          changed = 0

          for root in roots:
              if not root.exists():
                  continue

              for file in root.rglob("*"):
                  if file.name not in (
                      "build.gradle",
                      "build.gradle.kts"
                  ):
                      continue

                  checked += 1

                  try:
                      content = file.read_text()
                  except (OSError, UnicodeError):
                      continue

                  original = content

                  for pattern, replacement in patterns:
                      content = re.sub(
                          pattern,
                          replacement,
                          content
                      )

                  if content != original:
                      file.write_text(content)
                      changed += 1
                      print("Atualizado:", file)

          print("Gradle verificados:", checked)
          print("Gradle atualizados:", changed)

          if not Path("android/app").exists():
              raise SystemExit("Pasta android/app não encontrada.")
          PY

      - name: Verificar configuração
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter doctor -v
          grep -R "compileSdk" android/app

      - name: Compilar APK Release
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Preparar APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/app-release.apk"

          ls -lh "$GITHUB_WORKSPACE/dist/app-release.apk"

      - name: Calcular SHA-1 e SHA-256
        shell: bash
        run: |
          set -e

          APK="dist/app-release.apk"

          SHA1=$(sha1sum "$APK" | awk '{print $1}')
          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          {
            echo "## Appsdroid - APK Release"
            echo ""
            echo "**SHA-1:**"
            echo "\`$SHA1\`"
            echo ""
            echo "**SHA-256:**"
            echo "\`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Appsdroid-APK-Release
          path: dist/app-release.apk
          if-no-files-found: error
          retention-days: 14
