
name: Gerar APK Appsdroid

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '**/*.dart'
      - '**/pubspec.yaml'
      - '**/pubspec.lock'
      - '**/android/**'
      - '**/assets/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: appsdroid-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Appsdroid
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar e extrair projeto Flutter
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP="$(find . -maxdepth 1 -type f -iname '*appsdroid*.zip' -print | sort | head -n 1)"
            if [ -z "$ZIP" ]; then
              ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print | sort | head -n 1)"
            fi
            if [ -z "$ZIP" ]; then
              echo 'ERRO: coloque o projeto Appsdroid na raiz ou envie um ZIP.'
              exit 1
            fi

            echo "ZIP selecionado: $ZIP"
            mkdir -p "$RUNNER_TEMP/appsdroid-src"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/appsdroid-src"
            PUBSPEC="$(find "$RUNNER_TEMP/appsdroid-src" -type f -name pubspec.yaml -print -quit)"
            if [ -z "$PUBSPEC" ]; then
              echo 'ERRO: não encontrei pubspec.yaml dentro do ZIP.'
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto Flutter: $PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36 e Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Configurar Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configurar Flutter para Java 21
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          java -version
          flutter --version
          flutter doctor -v

      - name: Gerar estrutura Android se estiver ausente
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.appsdroid --project-name appsdroid .
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Forçar compileSdk 36
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit('ERRO: arquivo Gradle não encontrado.')

          content = gradle.read_text(encoding='utf-8')
          patterns = [
              r'(?m)^([ \t]*)compileSdkVersion\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)',
              r'(?m)^([ \t]*)compileSdk\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)',
          ]
          updated = content
          for pattern in patterns:
              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + 'compileSdk = 36',
                  updated,
                  count=1
              )
              if count:
                  break

          if updated == content:
              raise SystemExit('ERRO: não encontrei compileSdk para atualizar.')

          gradle.write_text(updated, encoding='utf-8')
          if not re.search(r'(?m)^\s*compileSdk\s*=\s*36\s*$', updated):
              raise SystemExit('ERRO: validação do SDK 36 falhou.')

          print(f'{gradle}: compileSdk = 36')
          PY

      - name: Baixar dependências Flutter
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK Release
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verificar APK e calcular hashes
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          {
            echo '## Appsdroid - APK Release'
            echo ''
            echo "**Tamanho:** $(du -h "$APK" | cut -f1)"
            echo ''
            echo "**SHA-1:** $(sha1sum "$APK" | awk '{print $1}')"
            echo ''
            echo "**SHA-256:** $(sha256sum "$APK" | awk '{print $1}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Appsdroid-APK-Release
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
