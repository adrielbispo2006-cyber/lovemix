name: LoveMix - Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/compilar-lovemix.yml'

permissions:
  contents: read

concurrency:
  group: compilar-lovemix-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.3.1'
  ANDROID_PLATFORM: '37'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      # Aceita o projeto na raiz do repositório OU dentro de um ZIP.
      - name: Localizar o projeto
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml && -f lib/main.dart ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)"
            [[ -n "$ZIP_FILE" ]] || { echo "::error::Não achei pubspec.yaml na raiz nem um .zip."; exit 1; }
            mkdir -p extracted
            unzip -q -o "$ZIP_FILE" -d extracted -x '__MACOSX/*'
            PUBSPEC="$(find extracted -type f -name pubspec.yaml -not -path '*/.dart_tool/*' | head -n 1)"
            [[ -n "$PUBSPEC" ]] || { echo "::error::pubspec.yaml não encontrado no ZIP."; exit 1; }
            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          test -f "$PROJECT_DIR/lib/main.dart"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "$SDKMANAGER" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" || true
          fi

      # O gradlew do projeto não tem o gradle-wrapper.jar: usa o Gradle instalado.
      - name: Configurar Gradle do projeto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"
          {
            echo "distributionBase=GRADLE_USER_HOME"
            echo "distributionPath=wrapper/dists"
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            echo "zipStoreBase=GRADLE_USER_HOME"
            echo "zipStorePath=wrapper/dists"
          } > "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec gradle "$@"\n' > "$PROJECT_DIR/android/gradlew"
          chmod 755 "$PROJECT_DIR/android/gradlew"

      # Usa sua chave fixa se os secrets existirem; senão cria uma chave
      # temporária só para o APK ser instalável (login Google pode falhar).
      - name: Assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          JKS="$RUNNER_TEMP/signing/release.jks"
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${STORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$JKS"
          else
            echo "::warning::Sem secrets de assinatura: usando chave temporária. O login Google só funciona com a chave cadastrada no Firebase."
            STORE_PASSWORD="temp123456"; KEY_ALIAS="temp"; KEY_PASSWORD="temp123456"
            keytool -genkeypair -v -keystore "$JKS" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LoveMix"
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$JKS"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Mostrar SHA-1 e SHA-256 (copie para o Firebase)
        shell: bash
        run: |
          set -euo pipefail
          INFO="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")"
          SHA1="$(echo "$INFO" | sed -n 's/^ *SHA1: *//p' | head -n 1)"
          SHA256="$(echo "$INFO" | sed -n 's/^ *SHA256: *//p' | head -n 1)"
          echo "=============================================="
          echo "SHA-1:   $SHA1"
          echo "SHA-256: $SHA256"
          echo "=============================================="
          {
            echo "## Chave de assinatura do APK"
            echo "Cadastre no Firebase: Configurações do projeto > Seus apps > Android (com.example.lovemix) > Adicionar impressão digital."
            echo ""
            echo "**SHA-1**"
            echo '```'
            echo "$SHA1"
            echo '```'
            echo "**SHA-256**"
            echo '```'
            echo "$SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Gerar android/local.properties
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_SDK" "$ANDROID_HOME" > android/local.properties

      # Plugins ZEGO antigos ainda usam jcenter(), que foi desligado.
      - name: Corrigir jcenter() nos plugins ZEGO
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          cache = Path.home() / ".pub-cache/hosted/pub.dev"
          for d in cache.glob("zego_*/android"):
              for f in list(d.glob("*.gradle")) + list(d.glob("*.gradle.kts")):
                  t = f.read_text()
                  n = re.sub(r"\bjcenter\s*\(\s*\)", "mavenCentral()", t)
                  if n != t:
                      f.write_text(n)
          PY

      - name: Analisar o código (mostra erros de Dart)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt

      - name: Compilar APK release
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            flutter build apk --release && break
            [[ "$attempt" == "2" ]] && { echo "::error::A compilação falhou. Veja o erro acima."; exit 1; }
            sleep 10
          done
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/LoveMix.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveMix-APK
          path: dist/LoveMix.apk
          retention-days: 14
