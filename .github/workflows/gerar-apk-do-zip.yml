
name: Vida Real RP - Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK do Vida Real RP
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Godot 4.4.1 e templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verificar arquivos do projeto
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f icon.png
          echo "Arquivos encontrados."

      - name: Importar projeto
        run: |
          godot --headless --editor --path . --quit

      - name: Compilar APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/VidaRealRP.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: VidaRealRP-APK-Android
          path: build/VidaRealRP.apk
          if-no-files-found: error
          retention-days: 14
