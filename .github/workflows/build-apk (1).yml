name: Compilar Clouddroid Gaming

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Compilar Clouddroid Gaming
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair e localizar projeto
        run: |
          # Se existir um .zip no repositório, extrai ele
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Extraindo $ZIP"
            mkdir -p _extraido
            unzip -o -q "$ZIP" -d _extraido
            SEARCH=_extraido
          else
            SEARCH=.
          fi
          PUBSPEC=$(find "$SEARCH" -name pubspec.yaml -not -path "*/.dart_tool/*" -not -path "*/.git/*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "ERRO: pubspec.yaml não encontrado"; exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "Projeto em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar versão
        run: flutter --version

      - name: Gerar arquivos Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.clouddroidgaming .
          fi
          # Remove o teste de exemplo gerado pelo flutter create (não combina com o app)
          rm -rf test

      - name: Ativar entrada de controle (gamepad)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          GRADLE=$(ls android/app/build.gradle android/app/build.gradle.kts 2>/dev/null | head -n 1)
          PKG=$(grep -E "applicationId|namespace" "$GRADLE" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Package: $PKG"
          DIR="android/app/src/main/kotlin/$(echo "$PKG" | tr . /)"
          # remove MainActivity padrão (kt ou java) para não duplicar
          find android/app/src/main -name "MainActivity.*" -delete
          mkdir -p "$DIR"
          cat > "$DIR/MainActivity.kt" <<EOT
          package $PKG

          import android.hardware.input.InputManager
          import android.os.Handler
          import android.view.KeyEvent
          import android.view.MotionEvent
          import io.flutter.embedding.android.FlutterActivity
          import org.flame_engine.gamepads_android.GamepadsCompatibleActivity

          class MainActivity : FlutterActivity(), GamepadsCompatibleActivity {
              private var keyListener: ((KeyEvent) -> Boolean)? = null
              private var motionListener: ((MotionEvent) -> Boolean)? = null

              override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
                  if (motionListener?.invoke(event) == true) return true
                  return super.dispatchGenericMotionEvent(event)
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (keyListener?.invoke(event) == true) return true
                  return super.dispatchKeyEvent(event)
              }

              override fun registerInputDeviceListener(listener: InputManager.InputDeviceListener, handler: Handler?) {
                  val manager = getSystemService(INPUT_SERVICE) as InputManager
                  manager.registerInputDeviceListener(listener, handler)
              }

              override fun registerKeyEventHandler(handler: (KeyEvent) -> Boolean) {
                  keyListener = handler
              }

              override fun registerMotionEventHandler(handler: (MotionEvent) -> Boolean) {
                  motionListener = handler
              }
          }
          EOT
          # remove a indentação inserida pelo YAML
          sed -i 's/^          //' "$DIR/MainActivity.kt"

      - name: Instalar dependências
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Verificar projeto
        working-directory: ${{ env.PROJECT_DIR }}
        # Só erros reais derrubam o build; infos e avisos são ignorados
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Gerar APK Release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verificar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Mostrar SHA-1 e SHA-256
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sha1sum build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Clouddroid-Gaming-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
