name: lovemix
description: Aplicativo de relacionamentos LoveMix em Flutter e Firebase.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  supabase_flutter: ^2.8.4
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  cloud_functions: ^5.3.4
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^22.3.3
  image_picker: ^1.1.2
  geolocator: 14.0.1
  geocoding: ^4.0.0
  video_player: ^2.9.2
  cached_network_image: ^4.0.6
  intl: ^0.20.2
  crypto: ^3.0.6
  zego_uikit_prebuilt_live_streaming: ^3.15.8
  zego_uikit: ^2.29.4
  zego_uikit_prebuilt_live_audio_room: ^3.16.12
  zego_uikit_signaling_plugin: ^2.8.23
  zego_uikit_prebuilt_call: ^4.17.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/lovemix_couple.jpg
    - assets/chest_purple.png
    - assets/vip_gift_box.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/lovemix.png"
  adaptive_icon_background: "#09000F"
  adaptive_icon_foreground: "assets/lovemix_launcher.png"
  min_sdk_android: 21


dependency_overrides:
  permission_handler_android: 13.0.1
